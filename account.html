<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Velvet Viking — Account</title>
<!--
  THE PUBLIC SHELL.

  Deliberately small, and deliberately public. Its whole job is to be the one
  page an athlete can always reach: sign in, find out why they are here, and be
  handed into VVV once access is established.

  It is public on purpose. If it were behind the gate there would be nowhere to
  sign in FROM, and once commercial gating arrives in 3A2 there would be nowhere
  for an expired athlete to manage or restore their subscription -- which the
  access contract requires stay available without entitlement.

  It contains no coaching engine, no training data and no pricing. 3A2 expands
  it with subscription state and checkout; nothing here anticipates that beyond
  leaving room for it.

  It also completes the magic-link return. When the gate is on, a sign-in link
  landing on /auth has no cookie yet, so /api/app bounces it here -- the URL
  fragment carrying the tokens survives that redirect, and consumeAuthHash()
  below picks it up. With the gate off the app handles the same fragment itself,
  exactly as it does today.
-->
<link rel="icon" href="/assets/icon.png">
<meta name="theme-color" content="#F4F1EA">
<script data-vvv-theme-boot>/*VVV-THEME-BOOT*/(function(){try{var s=localStorage.getItem('vvv_theme');var t=s?(JSON.parse(s)||{}).theme:null;document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/vvv-shell.css">
<style>
  /* Page-specific only. Everything structural, every colour and every control
     now comes from the shared shell, so this page cannot drift away from the
     rest of the product the way its pasted palette copy did. */
  body{display:flex; align-items:center; justify-content:center;
       padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));}
</style>
</head>
<body>
<div class="vvv-shell">
  <div class="vvv-brand">
    <p class="vvv-wordmark">Velvet Viking</p>
    <img class="vvv-crest" src="/assets/velvet-viking-crest.png" width="1223" height="1286"
         alt="Velvet Viking crest — Valhalla Awaits, Earn Your Place" loading="eager" decoding="async">
    <p class="vvv-tagline">Earn Your Place</p>
    <div class="vvv-rule"></div>
  </div>

  <div id="pane-signin">
    <h1 id="headline">Sign in to Velvet Viking</h1>
    <p id="lede">Velvet Viking now needs an account so your training block is tied to you and can follow you between devices. We email you a sign-in link — there is no password.</p>
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" inputmode="email">
    <button type="button" id="send" class="vvv-btn">Email me a sign-in link</button>
    <div class="vvv-msg" id="msg"></div>
  </div>

  <div id="pane-working" class="vvv-hidden">
    <h1>Signing you in…</h1>
    <p id="working-note">One moment.</p>
    <div class="vvv-msg" id="msg2"></div>
  </div>

  <div class="vvv-foot">
    <a href="/privacy">Privacy</a> &nbsp;·&nbsp; <a href="/terms">Terms</a>
  </div>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var NATIVE_REDIRECT = 'com.velvetviking.valhalla://auth';

  function isNativeApp(){
    return /VelvetViking|Capacitor/i.test(navigator.userAgent || '') ||
           (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  }
  function show(pane){
    $('pane-signin').classList.toggle('vvv-hidden', pane !== 'signin');
    $('pane-working').classList.toggle('vvv-hidden', pane !== 'working');
  }
  function say(el, text, kind){
    var n = $(el); n.textContent = text || '';
    n.className = 'vvv-msg' + (kind ? ' ' + kind : '');
  }

  /* Why the athlete is looking at this page. /api/app appends it so the shell
     can be specific instead of showing the same sentence to someone who has
     never signed in and someone whose tester access was withdrawn. */
  var why = (function(){
    try{ return new URLSearchParams(location.search).get('why') || ''; }catch(e){ return ''; }
  })();
  if (why === 'locked'){
    $('headline').textContent = 'Your access has ended';
    $('lede').textContent = 'Your training plan and history are safe and still stored. Sign in to see your account, or get in touch if you think this is wrong.';
  } else if (why === 'unavailable'){
    $('headline').textContent = 'We could not check your account';
    $('lede').textContent = 'Something on our side is not answering, so we cannot confirm your access right now. Please try again in a moment — nothing has changed on your account.';
  }

  /* ---- magic-link return ----
     Supabase puts the tokens in the URL fragment, which never reaches a server.
     They are read, exchanged for a delivery cookie, and then stripped from the
     address bar so a copied URL cannot carry a live session to someone else. */
  function readAuthHash(){
    var h = (location.hash || '').replace(/^#/, '');
    if (!h) return null;
    var p = {};
    h.split('&').forEach(function(kv){
      var i = kv.indexOf('=');
      if (i > 0) p[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
    });
    return p.access_token ? p : null;
  }

  function stripHash(){
    try{ history.replaceState(null, '', location.pathname + location.search); }
    catch(e){ location.hash = ''; }
  }

  /* The bridge. A verified Supabase token in, an HttpOnly delivery cookie out.
     The response body is only used to decide what to say -- it is not, and must
     never be treated as, permission to do anything. */
  function establish(accessToken){
    return fetch('/api/session', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'authorization': 'Bearer ' + accessToken }
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(body){
        return { status: r.status, body: body };
      });
    });
  }

  function enter(){ location.replace('/'); }

  var hash = readAuthHash();
  if (hash){
    show('working');
    /* Persist the session where the app already looks for it, so the runtime
       finds itself signed in on arrival. The cookie is what grants delivery;
       this is what stops the athlete having to sign in twice. */
    try{
      localStorage.setItem('vvv_cloud_session', JSON.stringify({
        access_token: hash.access_token,
        refresh_token: hash.refresh_token || null,
        expires_at: Date.now() + (parseInt(hash.expires_in, 10) || 3600) * 1000
      }));
    }catch(e){ /* private mode -- the cookie still works for this session */ }

    stripHash();
    establish(hash.access_token).then(function(r){
      if (r.status === 200) return enter();
      if (r.status === 403){
        show('signin');
        $('headline').textContent = 'Your access has ended';
        $('lede').textContent = 'You are signed in, but this account does not currently have access to Velvet Viking. Your training data is still stored.';
        return;
      }
      show('signin');
      say('msg', 'We signed you in but could not open Velvet Viking. Please try again.', 'err');
    }).catch(function(){
      show('signin');
      say('msg', 'We signed you in but could not reach Velvet Viking. Check your connection and try again.', 'err');
    });
  } else {
    /* Already holding a Supabase session from a previous visit? Try to trade it
       for a cookie before asking the athlete to do anything. This is what makes
       the gate invisible to someone who is simply already signed in. */
    var stored = null;
    try{ stored = JSON.parse(localStorage.getItem('vvv_cloud_session') || 'null'); }catch(e){}
    if (stored && stored.access_token){
      show('working');
      establish(stored.access_token).then(function(r){
        if (r.status === 200) return enter();
        show('signin');
        if (r.status === 403){
          $('headline').textContent = 'Your access has ended';
          $('lede').textContent = 'Your training plan and history are safe and still stored.';
        }
      }).catch(function(){ show('signin'); });
    }
  }

  $('send').addEventListener('click', function(){
    var email = ($('email').value || '').trim();
    if (!email || email.indexOf('@') < 1){ say('msg', 'Enter the email address you use for Velvet Viking.', 'err'); return; }
    $('send').disabled = true;
    say('msg', 'Sending…');
    fetch('/api/beta-signin', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        email: email,
        redirect: isNativeApp() ? NATIVE_REDIRECT : (location.origin + '/auth')
      })
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(b){ return { status:r.status, body:b }; });
    }).then(function(r){
      $('send').disabled = false;
      if (r.status === 200){ say('msg', 'Check your email for the sign-in link.', 'ok'); return; }
      if (r.status === 403){ say('msg', 'That address is not on the Velvet Viking list yet.', 'err'); return; }
      say('msg', 'We could not send the link just now. Please try again shortly.', 'err');
    }).catch(function(){
      $('send').disabled = false;
      say('msg', 'We could not reach Velvet Viking. Check your connection and try again.', 'err');
    });
  });

  $('email').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('send').click(); });
})();
</script>
</body>
</html>
