<title>Velvet Viking</title>
<style>
  html,body{height:100%; margin:0;}
  body{
    display:flex; align-items:center; justify-content:center; text-align:center;
    background:#15110D; color:#EDE3D0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;

<body>
  <!--
    This file is a local offline fallback bundled into the native app shell.
    In normal operation the app never shows this page -- capacitor.config.json's
    server.url loads the live Vercel deployment directly, so the real app UI
    and every future code update always come straight from the web, with no
    app-store/APK reinstall needed. This page only appears if the device has
    no network connection when the app is opened.
  -->
  <div>
    <p>Velvet Viking needs a connection to load your training block. Check your network and reopen the app.</p>
  </div>
</body>
