<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SACORO Start</title>
<!--
  /start IS A DOOR TO THE APP, AND NOTHING ELSE.

  Founder, 18 November 2026: "Remove the old start." This page used to hold
  screens of its own: a saved programme preview, Save My Plan, a sign-in form,
  a trial and checkout card, and "Your access has ended". The in-app
  first-time journey replaced every one of them (Welcome, the builder, the
  programme preview, Make It Yours, the seven-day trial with the two agreement
  ticks and the catalogue's prices, Welcome to SACORO), so they are gone, and
  /start now leads everybody to the app root, where the journey lives.

  WHY A PAGE AND NOT ONLY A ROUTE. /start is still a real address in four
  places that are not this repository's to change overnight: links already in
  inboxes, the website's buttons, the Android App Link filter
  (pathPrefix="/start" in AndroidManifest.xml), and the server's fallback for
  a sign-in redirect it refuses (api/beta-signin.js, ENTRY_PATH). A sign-in
  link that lands here carries its tokens in the URL fragment, and GoTrue
  reports a refused link as error / error_code in the fragment or the query.
  So the forward below keeps BOTH the query and the fragment, and the app
  (cloudConsumeAuthHash) or the account page (readAuthHash) completes the
  sign-in exactly as it would had the link pointed at the root. location.replace
  keeps /start, and any token, out of the back history.

  WHAT IS DELIBERATELY NOT HERE ANY MORE. No checkout, no agreement record, no
  price, no sign-in: those now live once, on the journey's trial screen and on
  /account, and their guarantees are asserted there (see
  test/onboardingOrder.test.js and test/checkoutAgreementsStartPage.test.js).
-->
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" href="/assets/favicon.png">
<meta name="theme-color" content="#151417">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Oswald:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/vvv-shell.css">
<style>
  /* Seen only for the moment the forward takes, or with scripts switched off. */
  body{display:flex; align-items:center; justify-content:center;
       padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));}
  .vvv-shell{max-width:560px; text-align:center;}
  p.say{font-family:var(--text-face); font-size:.875rem; line-height:1.6; margin:0 0 18px; color:var(--ink);}
</style>
<script>
/* To the root, with the query and the fragment intact (see the note above). */
(function(){
  var dest = '/' + (location.search || '') + (location.hash || '');
  try{ location.replace(dest); }catch(e){ location.href = dest; }
})();
</script>
</head>
<body>
<div class="vvv-shell">
  <div class="vvv-brand">
    <div class="vvv-lockup"><span class="vvv-dot" aria-hidden="true"></span><p class="vvv-wordmark">SACORO</p><span class="vvv-dot" aria-hidden="true"></span></div>
    <p class="vvv-by">By Velvet Viking</p>
    <div class="vvv-rule"></div>
  </div>
  <p class="say">One moment.</p>
  <a class="vvv-btn" id="open-app" href="/">Open SACORO</a>
</div>
</body>
</html>
