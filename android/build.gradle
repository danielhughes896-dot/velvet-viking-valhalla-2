// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    /* ONE KOTLIN STANDARD LIBRARY. Widget check run 6 stopped before any test
       ran: the test build found kotlin-stdlib 1.8.22 beside kotlin-stdlib-jdk8
       1.6.21, which carry the same classes. Nothing here pinned which one a
       dependency pulled in, so the build could resolve either way. From 1.8
       the jdk7 and jdk8 artifacts are empty shells over kotlin-stdlib, so
       every kotlin-stdlib* is held at the 1.8.22 already in use: no class
       changes, and no duplicate to find. */
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
                details.useVersion '1.8.22'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
