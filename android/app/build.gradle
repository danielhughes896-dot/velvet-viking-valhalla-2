apply plugin: 'com.android.application'

android {
    namespace = "com.velvetviking.valhalla"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.velvetviking.valhalla"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /* VERSION, AND WHY IT COMES FROM THE ENVIRONMENT.

           Play refuses an upload whose versionCode is not strictly greater than
           every versionCode already uploaded for this package, and it refuses it
           after the upload, by which time the build is wasted. A hardcoded 1 can
           therefore be uploaded exactly once in the lifetime of the app.

           CI passes the run number, which is monotonic by construction and needs
           nobody to remember to bump anything. A local build with nothing set
           still gets 1 and "1.0", so `./gradlew assembleDebug` on a laptop
           behaves exactly as it did before this change.

           versionName is the human string and is deliberately NOT derived from
           the run number: it tracks the SHELL's own version, which changes only
           when the native shell changes. RELEASE-VERSION-MODEL.md explains why
           that is a different number from the web runtime's commit, and how a
           tester's build is traced back to both. */
        versionCode System.getenv("VVV_VERSION_CODE") ? System.getenv("VVV_VERSION_CODE").toInteger() : 1
        versionName System.getenv("VVV_VERSION_NAME") ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Optional stable signing key.
    //
    // With nothing set, Gradle signs debug builds with a throwaway keystore that
    // the build machine generates on demand. On a fresh CI runner that means a
    // brand new certificate every single build, which breaks two things: App Link
    // verification can never match a fixed fingerprint in assetlinks.json, and a
    // newly downloaded APK refuses to install over the previously installed one.
    //
    // Setting the four VVV_KEYSTORE_* environment variables (CI writes them from
    // repository secrets, see ANDROID-APP-LINKS.md) signs every build with the
    // same key instead. Unset, this block is inert and the build behaves exactly
    // as it did before.
    signingConfigs {
        stable {
            def ksPath = System.getenv("VVV_KEYSTORE_FILE")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("VVV_KEYSTORE_PASSWORD")
                keyAlias System.getenv("VVV_KEY_ALIAS")
                keyPassword System.getenv("VVV_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv("VVV_KEYSTORE_FILE")) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Release must always carry the stable production key -- never the
            // auto-generated debug keystore -- so App Link verification and
            // update installs stay tied to one fixed fingerprint. There is
            // deliberately no fallback here: if the four VVV_KEYSTORE_* secrets
            // are missing, signingConfigs.stable has no storeFile and the task
            // below fails the build outright rather than shipping an artifact
            // signed with the wrong (or no) key.
            signingConfig signingConfigs.stable
        }
    }
}

// Release tasks specifically (not debug) require the real signing secrets.
// Gradle's own "storeFile not set" error is easy to miss in CI output, so
// fail loudly and early with a message that says exactly what's missing.
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.name in ['assembleRelease', 'bundleRelease'] }
    if (wantsRelease) {
        def missing = ['VVV_KEYSTORE_FILE', 'VVV_KEYSTORE_PASSWORD', 'VVV_KEY_ALIAS', 'VVV_KEY_PASSWORD']
            .findAll { !System.getenv(it) }
        if (missing) {
            throw new GradleException(
                "Release build requires the stable production keystore, but " +
                missing.join(', ') + " ${missing.size() > 1 ? 'are' : 'is'} not set. " +
                "Release builds never fall back to debug signing -- see ANDROID-APP-LINKS.md " +
                "for how to configure the four VVV_KEYSTORE_* secrets."
            )
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
