<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:#15110D; --bg-2:#1D1712; --bg-3:#261D14; --bg-4:#2E2318;
    --ink:#EDE3D0; --ink-dim:#B3A48C; --ink-faint:#948970;
    --line:#3B2E20; --line-soft:#2A2015;
    --bronze:#C0923F; --bronze-2:#9C7433; --gold:#E3B15A; --bronze-ink:#1A1204;
    --c-rest:#8C8272; --c-rest-soft:rgba(140,130,114,0.16);
    --c-easy:#84A56E; --c-easy-soft:rgba(132,165,110,0.16);
    --c-tempo:#CC9245; --c-tempo-soft:rgba(204,146,69,0.16);
    --c-threshold:#B5505A; --c-threshold-soft:rgba(181,80,90,0.16);
    /* --c-track/--c-gold are semantic aliases (zone-legend / active-highlight
       roles) that happen to reuse the brand bronze/gold -- referencing the
       base tokens instead of duplicating their hex keeps there being exactly
       one source of truth for each actual color. */
    --c-track:var(--bronze); --c-track-soft:rgba(192,146,63,0.16);
    --c-long:#5E93AC; --c-long-soft:rgba(94,147,172,0.16);
    --c-gold:var(--gold); --c-gold-soft:rgba(227,177,90,0.20);
    --radius:16px; --radius-sm:10px; --radius-lg:22px;
    --shadow:0 10px 30px rgba(0,0,0,0.4);
    --shadow-sm:0 4px 12px rgba(0,0,0,0.3);
    --maxw:720px;
    /* dedicated dark-Viking palette for modals, dropdowns & selects --
       deliberately fixed regardless of the light/dark theme toggle */
    --modal-surface:#141210; --modal-input-bg:#24201c; --modal-border:#3d352b;
    --modal-active:#c5a059; --modal-active-rgb:197,160,89; --modal-text:#e6dfd5;
    /* the app's one metallic-gold gradient system -- shared by the header
       title and the confidence gauge, so both read as the same finish. */
    --gold-bright:#F5D061; --gold-deep:#8A6D2B;
    --gold-shadow-1:#7A5C1E; --gold-shadow-2:#543E12;
    --strava-orange:#FC4C02;
    color-scheme:dark;
  }
  [data-theme="light"]{
    color-scheme:light;
    --bg:#F2ECDC; --bg-2:#FFFCF6; --bg-3:#EBE1C8; --bg-4:#E3D7B8;
    --ink:#241C15; --ink-dim:#5E5443; --ink-faint:#6B5F49;
    --line:#DCCEA9; --line-soft:#E7DABB;
    --shadow:0 10px 30px rgba(90,70,30,0.14);
    --shadow-sm:0 4px 12px rgba(90,70,30,0.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    transition:background .35s ease,color .35s ease;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .font-display{font-family:'Cinzel',serif;}
  .font-head{font-family:'Oswald',sans-serif; text-transform:uppercase;}
  .font-mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer; color:inherit; background:none; border:none; padding:0; margin:0;}
  input,select,textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:4px;}
  ::selection{background:var(--bronze); color:var(--bronze-ink);}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }

  /* ---------- layout ---------- */
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 16px;}
  .app-root{min-height:100vh; padding-bottom:88px;}

  /* ---------- sticky top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:50; background:rgba(21,17,13,0.92);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  [data-theme="light"] .topbar{background:rgba(242,236,220,0.92);}
  /* single-row header, contents vary by app state (see renderTopbar):
     onboarding shows shield/theme, Plan HQ/Settings show units/theme --
     the center column always holds the brand title. Fixed flex-basis (not
     grid's content-sized `auto` track) on the outer columns plus
     min-width:0 on all three is what stops them overlapping the title on
     narrow phones -- `auto` let the title claim more than its share and
     push the side content into it. */
  .topbar-inner{
    display:flex; align-items:center; gap:6px;
    padding:calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; max-width:var(--maxw); margin:0 auto;
  }
  /* all five main tabs: brand-only header, nothing to balance against --
     center the title and give it clean, even padding instead of the
     tighter/lopsided padding the old gauge/countdown/toggle rows needed. */
  .topbar-inner-brand-only{justify-content:center; padding-top:calc(14px + env(safe-area-inset-top, 0px)); padding-bottom:14px;}
  .tb-slot-left{flex:0 0 28%; min-width:0; overflow:hidden; text-align:left;}
  .tb-slot-center{flex:1; min-width:0; text-align:center;}
  .tb-slot-right{flex:0 0 32%; min-width:0; overflow:hidden; text-align:right; display:flex; align-items:center; justify-content:flex-end;}
  .brandmark{display:flex; flex-direction:column; align-items:center; min-width:0;}
  /* purely decorative brand rule under the title -- percentage width (not a
     fixed px value) so it scales with the title's own clamp()'d size and
     stays proportional across viewports; centered via align-items:center
     on the column above rather than any manual offset. */
  .brandmark::after{
    content:''; display:block; width:64%; height:1px; margin-top:6px;
    background:rgba(var(--modal-active-rgb), 0.35);
  }
  /* bold metallic 3D gold title -- deliberately fixed regardless of the
     light/dark theme toggle, same rationale as the modal palette. There is
     no plain .word rule: this is the only styling the brand text ever gets,
     so nothing here fights a more-specific ".brandmark .word" declaration
     for color/font-size (which used to silently break the gradient in
     Firefox, since it relies on the standard `color` cascade rather than
     just -webkit-text-fill-color). */
  .word-metallic{
    font-family:'Cinzel',serif; font-weight:800; font-size:clamp(0.85rem, 4.2vw, 1.05rem); letter-spacing:0.05em;
    text-transform:uppercase; white-space:nowrap;
    background:linear-gradient(180deg, var(--gold-bright) 0%, var(--modal-active) 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    text-shadow:0 1px 0 var(--gold-shadow-1), 0 2px 0 var(--gold-shadow-2), 0 3px 6px rgba(0,0,0,0.8);
  }
  /* the bright metallic-gold gradient reads fine on the dark theme's near-
     black header but loses contrast against light theme's cream -- swap to
     a solid dark bronze fill with a soft warm glow instead of the gradient. */
  [data-theme="light"] .word-metallic{
    background:none;
    -webkit-text-fill-color:#2B2317; color:#2B2317;
    text-shadow:0 1px 2px rgba(197, 160, 89, 0.4);
  }
  .unit-toggle{display:flex; border:1px solid var(--line); border-radius:99px; overflow:hidden;}
  .unit-toggle button{
    font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; letter-spacing:.5px;
    padding:6px 9px; color:var(--ink-faint); background:transparent;
  }
  .unit-toggle button.active{background:var(--bronze); color:var(--bg);}
  /* transparent pill + a light-grey border reads as washed-out/grey on the
     cream light theme -- fill it with a warm neutral instead. */
  [data-theme="light"] .unit-toggle{background:#E5E0D8;}
  [data-theme="light"] .unit-toggle button{color:#2B2317;}
  /* header instance only -- mirrors .countdown-badge's compact dimensions/
     border/radius so it reads as the same header-badge family as the race
     clock, instead of the larger touch-friendly pill the setup modal uses. */
  .tb-unit-toggle{
    display:flex; width:auto; max-width:64px; gap:2px;
    background:#1e1b18; border:1px solid rgba(197, 160, 89, 0.25); border-radius:6px;
    padding:4px 6px;
  }
  [data-theme="light"] .tb-unit-toggle{background:#EFECE6;}
  .tb-unit-toggle button{
    flex:1; font-family:'JetBrains Mono',monospace; font-size:0.7rem; font-weight:bold;
    letter-spacing:normal; padding:2px 0; color:#8c8273; background:transparent; border-radius:3px; text-align:center; line-height:1;
  }
  .tb-unit-toggle button.active{background:#c5a059; color:#1e1b18;}
  .countdown{display:flex; align-items:center; justify-content:flex-end;}
  .countdown-badge{
    display:grid; grid-template-columns:1fr 1fr; gap:2px 6px;
    background:#1e1b18; border:1px solid #c5a05933; border-radius:6px;
    padding:4px 6px;
  }
  .cd-cell{font-weight:700; color:#c5a059; font-size:0.7rem; text-align:center; white-space:nowrap;}
  /* light theme only -- the dark charcoal/gold badge above is untouched.
     Colour swap only: same size, radius, padding, typography and 2x2 grid. */
  [data-theme="light"] .countdown-badge{background:#EFECE6; border-color:rgba(197, 160, 89, 0.4);}
  [data-theme="light"] .cd-cell{color:#2B2317;}
  .cd-race-day{font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--gold); font-weight:700;}

  /* confidence score fuel gauge — top-left of the header */
  .confidence-gauge{display:flex; flex-direction:column; align-items:center; gap:2px;}
  .gauge-tick{stroke:var(--gold); stroke-width:1.4; opacity:.8;}
  .gauge-elabel, .gauge-flabel{
    font-family:'JetBrains Mono',monospace; font-size:8px; font-weight:700; fill:var(--ink-dim);
  }
  .gauge-caption{display:flex; align-items:baseline; gap:5px;}
  .gauge-pct{font-size:13px; font-weight:700; color:var(--gold);}
  /* themed (not the fixed --modal-text) since the gauge sits in the topbar,
     which itself flips with the light/dark toggle -- --modal-text is only
     ever defined for the dark palette and goes near-invisible in light mode. */
  .gauge-label{font-size:8.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-dim);}
  .checkpoint-banner{
    display:flex; align-items:flex-start; gap:11px; background:var(--c-gold-soft);
    border:1.5px solid var(--gold); border-radius:var(--radius-sm); padding:13px 14px; margin:16px 0;
  }
  .cb-icon{font-size:18px; line-height:1; flex:none;}
  .cb-text{font-size:12.5px; line-height:1.55; color:var(--ink);}
  .cb-text b{color:var(--gold);}
  .week.is-taper{border-color:var(--bronze);}
  .week.is-taper .week-head{background:var(--c-gold-soft);}
  .taper-note{
    display:flex; align-items:center; gap:7px; font-size:11px; color:var(--bronze);
    padding:8px 16px; background:var(--c-gold-soft); border-top:1px dashed var(--line);
  }
  .taper-note svg{width:13px; height:13px; flex:none;}
  .zone-card{margin:10px 14px 14px; padding:12px 13px; background:var(--bg-3); border:1px solid var(--line); border-radius:var(--radius-sm);}
  .zone-head{display:flex; align-items:center; justify-content:space-between; font-size:11.5px; margin-bottom:9px;}
  .zone-head span:first-child{text-transform:uppercase; letter-spacing:1px; color:var(--ink-dim); font-size:10.5px;}
  .zone-time{color:var(--gold);}
  .zbar{display:flex; height:9px; border-radius:99px; overflow:hidden; background:var(--bg-4);}
  .zbar-seg{height:100%;}
  .z-easy{background:var(--c-easy);}
  .z-mp{background:var(--c-long);}
  .z-threshold{background:var(--c-threshold);}
  .z-interval{background:var(--c-track);}
  .zone-legend{display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:10px;}
  .zleg-item{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--ink-dim);}
  .zleg-dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex:none;}
  .fuel-card{margin-top:10px; border:1px dashed var(--line); border-radius:8px; background:var(--bg-3);}
  .fuel-card summary{
    display:flex; align-items:center; gap:6px; padding:8px 10px; font-size:11px; font-weight:600;
    color:var(--bronze); cursor:pointer; list-style:none; user-select:none;
  }
  .fuel-card summary::-webkit-details-marker{display:none;}
  .fuel-card summary svg{width:13px; height:13px; flex:none;}
  .fuel-body{padding:2px 12px 10px;}
  .fuel-row{display:flex; align-items:center; justify-content:space-between; padding:4px 0; font-size:11.5px; border-bottom:1px solid var(--line-soft);}
  .fuel-row:last-of-type{border-bottom:none;}
  .fuel-row .k{color:var(--ink-dim);}
  .fuel-row .v{color:var(--ink);}
  .fuel-hint{font-size:10.5px; color:var(--ink-faint); margin-top:6px; line-height:1.5;}
  .build-tag{text-align:center; font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--ink-faint); opacity:.6; margin-top:18px;}
  .congrats-banner{
    margin:22px 0 8px; padding:28px 20px; text-align:center; border-radius:var(--radius-lg);
    background:linear-gradient(155deg, var(--bg-3), var(--bg-2)); border:2px solid var(--gold);
    box-shadow:0 0 0 1px var(--bronze) inset;
  }
  .cg-title{font-size:22px; letter-spacing:.08em; color:var(--gold); margin-bottom:12px;}
  .cg-quote{font-size:13px; letter-spacing:1.5px; line-height:2; color:var(--ink); text-transform:uppercase; font-weight:600;}

  /* ---------- print ---------- */
  @media print{
    body{background:#fff !important; color:#111 !important;}
    .topbar, .bottom-nav, #toast-mount, .checkpoint-banner, .plan-summary-bar,
    .day-check, .day-actions, .actual-panel, .fuel-card summary, .goal-toggle-hero,
    .setup-cta, .progress-bars, .modal-overlay{ display:none !important; }
    .week-body{max-height:none !important;}
    .fuel-card .fuel-body{display:block !important;}
    .week{break-inside:avoid; page-break-inside:avoid; border-color:#999 !important; background:#fff !important;}
    .day{break-inside:avoid; background:#fff !important; border-color:#ccc !important;}
    .hero, .day, .week, .zone-card, .congrats-banner, .fuel-card,
    .distance-badge, .stat, .day-badge, .week-vol, .week-num, .fuel-row, .zone-head,
    .cd-cell{ color:#111 !important; background:#fff !important; border-color:#999 !important; }
    .day-title, .week-phase, .cg-title, .distance-badge, .zbar-seg{color:#111 !important;}
    .zbar-seg{filter:grayscale(0.3) contrast(1.3);}
    .wrap{max-width:none !important;}
  }
  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:38px; height:38px; border-radius:999px; border:1px solid var(--line);
    background:var(--bg-2); color:var(--ink-dim); transition:.2s;
  }
  .icon-btn:hover{color:var(--ink); border-color:var(--bronze);}
  .icon-btn svg{width:18px; height:18px;}

  /* ---------- hero / progress ---------- */
  .hero{padding:32px 0 18px; text-align:center; position:relative;}
  .medallion-img{
    width:180px; max-width:60%; height:auto; border-radius:50%; display:block; margin:0 auto;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
  }
  .hero-tagline{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--ink-faint); margin-top:14px; margin-bottom:20px;
  }


  .stat-row{display:flex; justify-content:center; gap:22px; margin-top:16px; flex-wrap:wrap;}
  .stat{text-align:center;}
  .stat .v{font-family:'JetBrains Mono',monospace; font-size:19px; font-weight:700; color:var(--gold);}
  .stat .l{font-size:10px; letter-spacing:1.5px; color:var(--ink-faint); text-transform:uppercase; margin-top:2px;}

  .progress-bars{margin-top:16px; display:flex; flex-direction:column; gap:8px;}
  .pbar-row{display:flex; align-items:center; gap:10px;}
  .pbar-label{font-size:10px; letter-spacing:1px; color:var(--ink-faint); text-transform:uppercase; width:76px; text-align:right; flex:none;}
  .pbar-track{flex:1; height:7px; border-radius:99px; background:var(--bg-3); overflow:hidden; border:1px solid var(--line-soft);}
  .pbar-fill{height:100%; background:linear-gradient(90deg,var(--bronze),var(--gold)); border-radius:99px; transition:width .5s ease;}
  .pbar-num{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-dim); width:56px; flex:none;}

  /* ---------- section labels ---------- */
  .section-label{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:2px;
    font-size:12px; color:var(--ink-faint); display:flex; align-items:center; gap:8px; margin:22px 0 10px;
  }
  .section-label .rule{flex:1; height:1px; background:var(--line);}

  /* ---------- week accordion ---------- */
  .week{border:1px solid var(--line); border-radius:var(--radius); margin-bottom:12px; background:var(--bg-2); overflow:hidden; box-shadow:var(--shadow-sm);}
  .week-head{width:100%; text-align:left; background:none; border:none; padding:14px 16px; display:flex; align-items:center; gap:12px; color:var(--ink); transition:background .15s ease;}
  .week-head:hover{background:var(--bg-3);}
  .week-head:active{background:var(--bg-4);}
  .week-num{font-family:'Cinzel',serif; font-weight:700; font-size:20px; color:var(--bronze); flex:none; width:34px;}
  .week-meta{flex:1; min-width:0;}
  .week-phase{font-family:'Oswald',sans-serif; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--bronze);}
  .week-range{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-faint); margin-top:2px;}
  .week-vol{text-align:right; flex:none;}
  .week-vol .v{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; color:var(--ink);}
  .week-vol .l{font-size:9px; color:var(--ink-faint); letter-spacing:1px; text-transform:uppercase;}
  .week-chevron{flex:none; color:var(--ink-faint); transition:transform .25s;}
  .week-chevron svg{width:18px; height:18px; display:block;}
  .week.open .week-chevron{transform:rotate(180deg);}
  .week-body{max-height:0; overflow:hidden; transition:max-height .35s ease;}
  .week.open .week-body{max-height:10000px;}
  .week-body-inner{padding:2px 12px 14px;}
  .week-today-flag{display:inline-block; margin-left:8px; font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--bronze-ink); background:var(--gold); padding:2px 6px; border-radius:99px; font-family:'Oswald',sans-serif;}

  /* ---------- day card ---------- */
  .day{
    border-left:4px solid var(--c-rest); background:var(--bg-3); border-radius:var(--radius-sm);
    padding:11px 12px; margin-top:8px; transition:.2s; position:relative;
  }
  .day:hover{background:var(--bg-4);}
  .day.type-easy{border-left-color:var(--c-easy);}
  .day.type-tempo{border-left-color:var(--c-tempo);}
  .day.type-threshold{border-left-color:var(--c-threshold);}
  .day.type-track{border-left-color:var(--c-track);}
  .day.type-long{border-left-color:var(--c-long);}
  .day.type-tuneup{border-left-color:var(--c-gold); background:var(--c-gold-soft);}
  .day.type-race{border-left-color:var(--c-gold); background:var(--c-gold-soft);}
  .day.is-today{box-shadow:0 0 0 1.5px var(--gold) inset;}
  .day.drag-over{box-shadow:0 0 0 2px var(--bronze) inset; background:var(--bg-4);}
  .day.dragging{opacity:.4;}
  .day-top{display:flex; align-items:flex-start; gap:10px;}
  .day-check{flex:none; margin-top:2px;}
  .day-check input{width:19px; height:19px; accent-color:var(--bronze); cursor:pointer;}
  .day-main{flex:1; min-width:0;}
  .day-row1{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .day-date{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-faint);}
  .day-badge{font-family:'Oswald',sans-serif; font-size:9.5px; letter-spacing:1px; text-transform:uppercase; padding:2px 7px; border-radius:99px; font-weight:600;}
  .day-badge.type-rest{background:var(--c-rest-soft); color:var(--c-rest);}
  .day-badge.type-easy{background:var(--c-easy-soft); color:var(--c-easy);}
  .day-badge.type-tempo{background:var(--c-tempo-soft); color:var(--c-tempo);}
  .day-badge.type-threshold{background:var(--c-threshold-soft); color:var(--c-threshold);}
  .day-badge.type-track{background:var(--c-track-soft); color:var(--c-track);}
  .day-badge.type-long{background:var(--c-long-soft); color:var(--c-long);}
  .day-badge.type-tuneup{background:var(--c-gold-soft); color:var(--gold);}
  .day-badge.type-race{background:var(--gold); color:var(--bronze-ink);}
  /* collapsed-card execution score -- always visible in the header row
     once a workout is completed and scoreable, regardless of whether the
     actual-panel below is showing. */
  .exec-pill{font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; letter-spacing:.3px; padding:2px 8px; border-radius:99px; background:var(--c-gold-soft); color:var(--gold);}
  .day-title{font-weight:600; font-size:14.5px; margin-top:3px; color:var(--ink);}
  .day-targets{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-dim); margin-top:3px; display:flex; gap:10px; flex-wrap:wrap;}
  .day-targets .mp{color:var(--gold);}
  /* target HR sits alongside pace/distance but reads as secondary, matching
     how HR is treated in the Pace Reference and Plan HQ zone cards. */
  .day-targets .hr{color:var(--ink-faint);}
  .day-desc{font-size:12.5px; color:var(--ink-dim); margin-top:6px; line-height:1.45;}
  .day-actions{display:flex; gap:6px; flex:none;}
  .day-actions button{background:none; border:none; color:var(--ink-faint); padding:4px; border-radius:6px; display:flex;}
  .day-actions button:hover{color:var(--bronze); background:var(--bg-4);}
  .day-actions svg{width:16px; height:16px;}

  /* expanded-card execution score -- prominent gold banner above the
     logging fields, same visual language as .checkpoint-banner. */
  .execution-score-banner{
    display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px;
    background:var(--c-gold-soft); border:1.5px solid var(--gold); border-radius:var(--radius-sm); padding:10px 14px;
  }
  .esb-label{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-dim);}
  .esb-pct{font-size:20px; font-weight:800; color:var(--gold);}
  .actual-panel{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .actual-field{display:flex; flex-direction:column; gap:3px;}
  .actual-field label{font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-faint);}
  .actual-field input, .actual-field textarea{
    background:var(--bg-4); border:1px solid var(--line); border-radius:7px; color:var(--ink);
    padding:7px 8px; font-size:13px; font-family:'JetBrains Mono',monospace; width:100%;
  }
  .actual-field textarea{font-family:'Inter',sans-serif; resize:vertical; min-height:38px;}
  .actual-field.full{grid-column:1/-1;}
  .actual-clear{grid-column:1/-1; text-align:right;}
  .actual-clear button{background:none; border:none; color:var(--ink-faint); font-size:11px; text-decoration:underline; padding:2px;}

  /* ---------- zone paces card (main dashboard) ---------- */
  .zone-paces-card{margin:14px 14px 0; padding:14px 15px; background:var(--bg-2); border:1px solid var(--line); border-radius:var(--radius);}
  .zpc-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
  .zpc-head span:first-child{font-size:13px; letter-spacing:.5px; text-transform:uppercase; color:var(--ink);}
  .zpc-vdot{font-size:11px; color:var(--bronze);}
  .pzr{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line-soft);}
  .pzr:last-of-type{border-bottom:none;}
  .pzr-label{font-size:12.5px; color:var(--ink-dim); flex:1; min-width:0;}
  .pzr-tag{font-size:9px; letter-spacing:.5px; text-transform:uppercase; color:var(--bronze); border:1px solid var(--bronze); border-radius:99px; padding:1px 6px; margin-left:4px;}
  /* target HR range, shown alongside the pace inputs on the same row --
     stacked under the zone label rather than a third flex column, so the
     row still fits on narrow phones without wrapping or crowding the
     pace-override inputs. */
  .pzr-hr{font-size:10.5px; color:var(--ink-faint); margin-top:2px;}
  .pzr-inputs{display:flex; align-items:center; gap:5px; flex:none;}
  .pzr-input{
    width:52px; background:var(--bg-4); border:1px solid var(--line); border-radius:7px; color:var(--ink);
    padding:6px 6px; font-size:12.5px; font-family:'JetBrains Mono',monospace; text-align:center;
  }
  .pzr-sep{color:var(--ink-faint); font-size:12px;}
  .pzr-unit{color:var(--ink-faint); font-size:11px; width:20px;}

  /* ---------- compact read-only pace reference (Today tab) ---------- */
  .pace-ref-card{margin:14px 0 0; padding:12px 15px; background:var(--bg-2); border:1px solid var(--line); border-radius:var(--radius);}
  .pace-ref-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:2px;}
  .pace-ref-head span:first-child{font-size:12px; letter-spacing:.5px; text-transform:uppercase; color:var(--ink);}
  .pace-ref-vdot{font-size:11px; color:var(--bronze);}
  .pace-ref-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid var(--line-soft); font-size:12px;}
  .pace-ref-row:last-of-type{border-bottom:none;}
  .pace-ref-label{color:var(--ink-dim);}
  .pace-ref-val{color:var(--ink);}

  /* ---------- AI post-session execution review ---------- */
  .exec-review-card{margin-top:10px; padding:11px 12px; background:var(--bg-4); border:1px solid var(--line); border-radius:var(--radius-sm);}
  .exec-review-head{display:flex; align-items:center; gap:6px; font-size:11px; letter-spacing:.5px; text-transform:uppercase; color:var(--bronze); margin-bottom:8px;}
  .exec-review-head svg{width:14px; height:14px;}
  .exec-review-src{margin-left:auto; font-size:9px; text-transform:none; letter-spacing:0; color:var(--ink-faint); background:var(--bg-3); border-radius:99px; padding:2px 7px;}
  .exec-review-body{display:flex; align-items:center; gap:12px;}
  .exec-review-score{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:20px; flex:none; min-width:52px; text-align:center; border-radius:10px; padding:6px 4px;}
  .exec-review-score.good{color:var(--c-easy); background:var(--c-easy-soft);}
  .exec-review-score.ok{color:var(--c-tempo); background:var(--c-tempo-soft);}
  .exec-review-score.low{color:var(--c-threshold); background:var(--c-threshold-soft);}
  .exec-review-summary{font-size:12.5px; color:var(--ink-dim); line-height:1.45;}
  /* component breakdown -- shows how the single score was reached */
  .exec-parts{display:flex; flex-wrap:wrap; gap:6px 10px; margin-top:9px; padding-top:8px; border-top:1px solid var(--line-soft);}
  .exec-part{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ink-dim); white-space:nowrap;}
  .exec-part-w{color:var(--ink-faint);}
  .exec-part-off{opacity:.45;}

  /* ---------- tune-up checkpoint card ---------- */
  .checkpoint{
    border:1.5px dashed var(--gold); border-radius:var(--radius); padding:18px 16px; margin:14px 0 20px;
    background:var(--c-gold-soft); text-align:center;
  }
  .checkpoint h3{font-family:'Cinzel',serif; font-size:18px; margin:0 0 6px; color:var(--ink);}
  .checkpoint p{font-size:12.5px; color:var(--ink-dim); margin:0 0 4px; line-height:1.5;}
  .checkpoint .hint{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--bronze); margin-bottom:12px;}
  .goal-options{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:10px;}
  .goal-opt{
    border:1.5px solid var(--line); background:var(--bg-2); border-radius:var(--radius-sm);
    padding:10px 16px; text-align:center; min-width:88px; transition:.2s;
  }
  .goal-opt .t{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; color:var(--ink);}
  .goal-opt .p{font-size:10px; color:var(--ink-faint); margin-top:2px;}
  .goal-opt.active{border-color:var(--gold); background:var(--c-gold-soft);}
  .goal-opt.active .t{color:var(--gold);}
  .goal-opt:hover{border-color:var(--bronze);}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    border-radius:var(--radius-sm); padding:11px 18px; font-size:13.5px; font-weight:600;
    border:1px solid var(--line); background:var(--bg-3); color:var(--ink); transition:.2s;
  }
  .btn:hover{border-color:var(--bronze);}
  .btn-primary{background:linear-gradient(135deg,var(--bronze),var(--bronze-2)); color:var(--bronze-ink); border:none;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:none; border:1px solid var(--line);}
  .btn-danger{background:none; border:1px solid var(--c-threshold); color:var(--c-threshold);}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 12px; font-size:12px;}
  .btn svg{width:15px; height:15px; flex:none;}

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,8,6,0.65); z-index:100;
    display:flex; align-items:flex-end; justify-content:center; padding:0;
    animation:fadein .18s ease;
  }
  @keyframes fadein{from{opacity:0;} to{opacity:1;}}
  @media (min-width:640px){ .modal-overlay{align-items:center; padding:20px;} }
  .modal-card{

<body>
<div id="app" class="app-root"></div>
<div id="toast-mount"></div>
<script>
'use strict';

/* =========================================================
   CONSTANTS
   ========================================================= */
var STORAGE_KEY = 'velvet-viking-generator-v2';
var BUILD_ID = '2026-08-10.1';

var DISTANCE_PROFILES = {
  '5k':    { key:'5k',    label:'5K',              raceKm:5,     longCapKm:12, volMult:1.30, emphasis:'speed',     blockName:'Speed & Threshold Block' },
  '10k':   { key:'10k',   label:'10K',             raceKm:10,    longCapKm:15, volMult:1.35, emphasis:'speed',     blockName:'Speed & Threshold Block' },
  'half':  { key:'half',  label:'Half Marathon',   raceKm:21.1,  longCapKm:20, volMult:1.55, emphasis:'threshold', blockName:'Aerobic & Tempo Block' },
  'full':  { key:'full',  label:'Full Marathon',   raceKm:42.2,  longCapKm:32, volMult:1.75, emphasis:'endurance', blockName:'Endurance & Long Run Block' },
  'ultra': { key:'ultra', label:'Ultra (50K)',     raceKm:50,    longCapKm:36, volMult:2.00, emphasis:'timeonfeet',blockName:'Time-on-Feet & Back-to-Back Block', backToBack:true }
};
var DISTANCE_ORDER = ['5k','10k','half','full','ultra'];

var PACE_CHECKPOINTS = {
  '5k':   [1,2,3,4,5],
  '10k':  [2,4,6,8,10],
  'half': [5,10,15,20,21.1],
  'full': [10,20,30,40,42.2],
  'ultra':[10,20,30,40,50]
};

var GOAL_KEYS = ['A','B','C'];
var GOAL_OFFSETS = { A:1.00, B:0.975, C:0.95 }; // B/C are faster (lower time) VDOT-equivalent multipliers on time, applied as smart defaults only

/* =========================================================
   VDOT ENGINE (Daniels-Gilbert equations)
   ========================================================= */
function vo2FromVelocity(v){ return -4.60 + 0.182258*v + 0.000104*v*v; }
function pctVO2FromTimeMin(tMin){ return 0.8 + 0.1894393*Math.exp(-0.012778*tMin) + 0.2989558*Math.exp(-0.1932605*tMin); }
function vdotFromPerformance(distanceM, timeSec){
  if (!distanceM || !timeSec || timeSec<=0) return null;
  var tMin = timeSec/60;
  var v = distanceM/tMin;
  return vo2FromVelocity(v) / pctVO2FromTimeMin(tMin);
}
function velocityFromVO2(vo2){
  var a=0.000104, b=0.182258, c=-4.60-vo2;
  var disc = b*b - 4*a*c;
  if (disc<0 || vo2<=0) return null;
  return (-b + Math.sqrt(disc)) / (2*a);
}
function paceSecPerKmFromVelocity(v){ return v>0 ? 60000/v : null; }
function equivalentTimeSec(vdot, distanceM){
  if (!vdot || vdot<=0) return null;
  var lo=45, hi=36000;
  for (var i=0;i<60;i++){
    var mid=(lo+hi)/2;
    var tMin=mid/60;
    var v=distanceM/tMin;
    var testVdot = vo2FromVelocity(v)/pctVO2FromTimeMin(tMin);
    if (testVdot>vdot) lo=mid; else hi=mid;
  }
  return Math.round((lo+hi)/2);
}
var VDOT_ZONES = {
  E:{lo:0.62,hi:0.77}, M:{lo:0.78,hi:0.84}, T:{lo:0.86,hi:0.90}, I:{lo:0.97,hi:1.00}, R:{lo:1.05,hi:1.11}
};
function trainingPacesFromVDOT(vdot){
  var out = {};
  if (!vdot){ Object.keys(VDOT_ZONES).forEach(function(k){ out[k]={slow:null,fast:null}; }); return out; }
  Object.keys(VDOT_ZONES).forEach(function(k){
    var z = VDOT_ZONES[k];
    var vLo = velocityFromVO2(vdot*z.lo);
    var vHi = velocityFromVO2(vdot*z.hi);
    out[k] = { slow: paceSecPerKmFromVelocity(vLo), fast: paceSecPerKmFromVelocity(vHi) };
  });
  return out;
}
function goalPaceSecPerKm(vdot, raceDistanceM){
  // the pace that exactly produces the goal time over the goal distance, at this VDOT
  var t = equivalentTimeSec(vdot, raceDistanceM);
  if (!t) return null;
  return t / (raceDistanceM/1000);
}

/* =========================================================
   HR ZONES — same zoneKey system as VDOT_ZONES (E/M/T/I/R) so every
   place that already resolves a workout's pace zone via TYPE_META.zoneKey
   resolves its HR zone the same way, with no separate type-to-zone map.
   Offsets are BPM relative to LTHR, reproducing a standard 5-zone LTHR
   model (a runner with LTHR 172 lands Easy 155-163, Tempo 164-171,
   Threshold 172-182, Interval/Repetition >185 up to Max HR).
   ========================================================= */
var HR_ZONE_OFFSETS = {
  E:{lo:-17,hi:-9}, M:{lo:-8,hi:-1}, T:{lo:0,hi:10}, I:{lo:13,hi:null}, R:{lo:13,hi:null}
};
function hrZonesFromLTHR(lthr, maxHR){
  var out = {};
  Object.keys(HR_ZONE_OFFSETS).forEach(function(k){
    if (!lthr){ out[k] = { lo:null, hi:null, openEnded:false }; return; }
    var off = HR_ZONE_OFFSETS[k];
    var lo = Math.round(lthr + off.lo);
    var openEnded = off.hi==null;
    var hi = openEnded ? (maxHR!=null ? Math.round(maxHR) : null) : Math.round(lthr + off.hi);
    out[k] = { lo:lo, hi:hi, openEnded:openEnded };
  });
  return out;
}
function getActiveHRZones(){
  var su = state.setup;
  return hrZonesFromLTHR(su && su.lthr, su && su.maxHR);
}
// Mirrors getTargetPaceRangeSecPerKm(dd) exactly -- same zoneKey lookup,
// just against the HR table instead of the pace table. Returns null for
// rest/race (no zoneKey) or when LTHR hasn't been configured.
function getTargetHRRangeForDay(dd){
  var tm = TYPE_META[dd.type];
  if (!tm || !tm.zoneKey) return null;
  var z = getActiveHRZones()[tm.zoneKey];
  if (!z || z.lo==null) return null;
  return z;
}
function fmtHRRange(zone){
  if (!zone || zone.lo==null) return null;
  if (zone.openEnded) return '>'+zone.lo+' BPM';
  return zone.lo+'–'+zone.hi+' BPM';
}

/* =========================================================
   DATE / TIME / PACE HELPERS
   ========================================================= */
// Pure UTC-anchored arithmetic -- deliberately never touches local time.
// Parsing "T00:00:00" as local midnight and then reading it back via
// toISOString() (which is always UTC) silently shifts the result a day
// early for anyone in a positive UTC-offset timezone (UK/EU/AU/etc during
// their summer, most of Asia year-round). Building the Date from Date.UTC
// and stepping with setUTCDate keeps the whole round-trip in UTC, so the
// calendar date it returns matches the input regardless of where the
// browser's clock thinks it is.
function addDays(dateStr, n){
  var parts = dateStr.split('-').map(Number);
  var d = new Date(Date.UTC(parts[0], parts[1]-1, parts[2]));
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0,10);
}
function dow(dateStr){ return new Date(dateStr+'T00:00:00').toLocaleDateString('en-US',{weekday:'short'}); }
function dShort(dateStr){ return new Date(dateStr+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function dLong(dateStr){ return new Date(dateStr+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}); }
function todayStr(){
  var d = new Date(); var tz = d.getTimezoneOffset();
  return new Date(d.getTime()-tz*60000).toISOString().slice(0,10);
}
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function round1(n){ return Math.round(n*10)/10; }
function round2(n){ return Math.round(n*100)/100; }
// Smart distance rounding -- clean, watch-friendly numbers instead of the
// generator's raw one-decimal math. Easy/aerobic days round to the nearest
// half km, long runs to the nearest full km, and quality (tempo/interval/
// repetition/threshold) sessions to the nearest half km. Race day and the
// mid-block fitness checkpoint are exempt -- rounding a race distance
// (e.g. 42.2km) or a calibration time-trial would corrupt them.
function roundWorkoutKm(type, km){
  if (type==='long') return roundTo(km, 1);
  if (type==='easy' || type==='tempo' || type==='threshold' || type==='interval' || type==='repetition') return roundTo(km, 0.5);
  return round1(km);
}

/* =========================================================
   UNITS \u2014 storage is always km/sec-per-km internally; these
   helpers convert for display only, so nothing else in the app
   needs to know or care which unit the person is looking at.
   ========================================================= */
function displayUnit(){ return (state && state.units==='mi') ? 'mi' : 'km'; }
function kmToDisplay(km){ if (km==null) return null; return (state && state.units==='mi') ? round2(km*0.621371) : round1(km); }
function fmtDist(km){ if (km==null) return '\u2014'; return kmToDisplay(km)+displayUnit(); }
function parseDistInput(val){
  var n = parseFloat(val);
  if (isNaN(n)) return null;
  return (state && state.units==='mi') ? round1(n/0.621371) : round1(n);
}
// sec//km (how every pace is held internally) -> sec per displayed unit.
// Single source of truth for this conversion, which several render paths
// and every activity-import path need.
function paceSecToDisplay(secPerKm){
  if (secPerKm==null) return null;
  return (state && state.units==='mi') ? secPerKm*1.60934 : secPerKm;
}
function fmtPaceFromSecPerKm(secPerKm){
  if (secPerKm==null) return null;
  return secToPace(paceSecToDisplay(secPerKm))+'/'+displayUnit();
}
// dd.actual.pace is stored in the runner's DISPLAY unit -- the log field is
// labelled "Avg Pace /mi" in miles mode, and actualPaceSecPerKm() converts
// back on that assumption. Anything arriving as sec/km (file import, Strava
// sync, CSV) must therefore be converted before it is stored, or in miles
// mode it gets read back as a per-mile pace and scored against the wrong
// target. Returns the "m:ss" string ready to store.
function paceSecPerKmToStoredStr(secPerKm){
  if (secPerKm==null) return null;
  return secToPace(paceSecToDisplay(secPerKm));
}
function clamp(n,lo,hi){ return Math.max(lo,Math.min(hi,n)); }
function escapeHtml(s){
  if (s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
}
function uid(){ return 'x'+Math.random().toString(36).slice(2,10); }
function paceToSec(p){
  if (p===null||p===undefined||p==='') return null;
  var parts = String(p).split(':');
  if (parts.length<2) return null;
  var m=parseInt(parts[0],10), s=parseInt(parts[1],10);
  if (isNaN(m)||isNaN(s)) return null;
  return m*60+s;
}
function secToPace(sec){
  if (sec===null||sec===undefined||isNaN(sec)||!isFinite(sec)) return '';
  sec = Math.round(sec);
  var m = Math.floor(sec/60), s = sec%60;
  return m+':'+(s<10?'0':'')+s;
}
function secToClock(sec){
  if (sec===null||sec===undefined||isNaN(sec)||!isFinite(sec)||sec<0) return '';
  sec = Math.round(sec);
  var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  var mm = (h>0 && m<10) ? '0'+m : String(m);
  var ss = (s<10?'0':'')+s;
  return (h>0 ? h+':' : '') + mm + ':' + ss;
}
function clockToSec(str){
  if (!str) return null;
  var parts = String(str).split(':').map(function(x){return parseInt(x,10);});
  if (parts.some(isNaN)) return null;
  if (parts.length===3) return parts[0]*3600+parts[1]*60+parts[2];
  if (parts.length===2) return parts[0]*60+parts[1];
  return null;
}

/* =========================================================
   QUALITY DAY STRUCTURE LIBRARY (by distance emphasis + phase)
   Each generator takes (pos 0..1 progress-through-build, emphasis) and
   returns a workout spec sized to roughly the same session-km envelope
   as the old single-track progression it replaces, so weekly volume
   budgets stay stable -- only the STRUCTURE rotates week to week. Pools
   are keyed by phase (Base/Build/Peak) so the *kind* of session also
   shifts with the block, not just its size:
     Base  -> Hill Repeats / Fartlek (unstructured aerobic power)
     Build -> Track Intervals / Ladders / Deuces (structured speed work)
     Peak  -> Goal-Pace reps & blocks (race-specific rhythm)
   ========================================================= */
var LONG_FRACTION = { speed:0.24, threshold:0.28, endurance:0.32, timeonfeet:0.36 };
var TT_DISTANCE_KM = { speed:3, threshold:5, endurance:6, timeonfeet:8 };

var EMPHASIS_INTERVAL_RANGE = {
  speed:      { repsLo:6, repsHi:10, mLo:300, mHi:1000 },
  threshold:  { repsLo:4, repsHi:8,  mLo:400, mHi:1000 },
  endurance:  { repsLo:3, repsHi:8,  mLo:400, mHi:1200 },
  timeonfeet: { repsLo:5, repsHi:8,  mLo:400, mHi:800  }
};
var EMPHASIS_TEMPO_RANGE = {
  speed:      { minLo:12, minHi:20, kmLo:3, kmHi:5 },
  threshold:  { minLo:15, minHi:25, kmLo:4, kmHi:6 },
  endurance:  { minLo:20, minHi:35, kmLo:5, kmHi:8 },
  timeonfeet: { minLo:25, minHi:45, kmLo:4, kmHi:7 }
};
function lerp(lo,hi,pos){ return lo+(hi-lo)*clamp(pos,0,1); }
function roundTo(n,step){ return Math.round(n/step)*step; }

/* ---- Interval / Speed day structures ---- */
function structHillRepeats(pos, emphasis){
  return { reps:Math.round(lerp(5,8,pos)), hillSec:Math.round(lerp(35,60,pos)), t:'interval' };
}
function structFartlek(pos, emphasis){
  return { reps:Math.round(lerp(5,9,pos)), fartlekMin:(emphasis==='timeonfeet'?3:2), t:'interval' };
}
function structTrackIntervals(pos, emphasis){
  var r = EMPHASIS_INTERVAL_RANGE[emphasis] || EMPHASIS_INTERVAL_RANGE.threshold;
  var m = roundTo(lerp(r.mLo, r.mHi, pos), 100);
  return { reps:Math.round(lerp(r.repsLo, r.repsHi, pos)), m:m, t:(m<=400 && pos<0.35)?'repetition':'interval' };
}
function structLadder(pos, emphasis){
  var r = EMPHASIS_INTERVAL_RANGE[emphasis] || EMPHASIS_INTERVAL_RANGE.threshold;
  var base = roundTo(lerp(r.mLo, Math.min(r.mHi,800), pos), 100);
  return { ladder:[base, base*2, base*3, base*2, base], t:'interval' };
}
function structDeuce(pos, emphasis){
  var r = EMPHASIS_INTERVAL_RANGE[emphasis] || EMPHASIS_INTERVAL_RANGE.threshold;
  return { sets:2, reps:Math.max(3, Math.round(lerp(r.repsLo, r.repsHi, pos)/2)), m:roundTo(lerp(r.mLo, r.mHi, pos),100), t:'interval' };
}
function structGoalPaceIntervals(pos, emphasis){
  var m = emphasis==='speed' ? 800 : (emphasis==='endurance'||emphasis==='timeonfeet' ? 1600 : 1200);
  return { reps:Math.round(lerp(3,5,pos)), m:m, t:'goalpace' };
}
var INTERVAL_STRUCTURE_POOL = {
  Base:  [structHillRepeats, structFartlek],
  Build: [structTrackIntervals, structLadder, structDeuce],
  Peak:  [structGoalPaceIntervals, structTrackIntervals]
};

/* ---- Tempo / Threshold day structures ---- */
function structSteadyTempo(pos, emphasis){
  var r = EMPHASIS_TEMPO_RANGE[emphasis] || EMPHASIS_TEMPO_RANGE.threshold;
  return { type:'steady', min:Math.round(lerp(r.minLo, r.minHi, pos)) };
}
function structProgressiveTempo(pos, emphasis){
  var r = EMPHASIS_TEMPO_RANGE[emphasis] || EMPHASIS_TEMPO_RANGE.threshold;
  return { type:'progressive', min:Math.round(lerp(r.minLo, r.minHi, pos)) };
}
function structSplitTempo(pos, emphasis){
  var r = EMPHASIS_TEMPO_RANGE[emphasis] || EMPHASIS_TEMPO_RANGE.threshold;
  return { type:'tempo', min:Math.round(lerp(r.minLo, r.minHi, pos)), split:2 };
}
function structThresholdContinuous(pos, emphasis){
  var r = EMPHASIS_TEMPO_RANGE[emphasis] || EMPHASIS_TEMPO_RANGE.threshold;
  return { type:'threshold', km:roundTo(lerp(r.kmLo, r.kmHi, pos), 0.5) };
}
function structGoalPaceBlock(pos, emphasis){
  var r = EMPHASIS_TEMPO_RANGE[emphasis] || EMPHASIS_TEMPO_RANGE.threshold;
  return { type:'goalpace', km:roundTo(lerp(r.kmLo, r.kmHi, pos), 0.5) };
}
var TEMPO_STRUCTURE_POOL = {
  Base:  [structSteadyTempo, structThresholdContinuous],
  Build: [structProgressiveTempo, structSplitTempo],
  Peak:  [structGoalPaceBlock, structThresholdContinuous]
};

// Rotates through the phase's candidate structures by absolute week number so
// the exact same format never repeats on consecutive weeks; unmapped phases
// (Taper, Race Week) fall back to the race-specific Peak pool.
function pickQualityStructure(pool, phase, weekNum, pos, emphasis){
  var candidates = pool[phase] || pool.Peak;
  return candidates[weekNum % candidates.length](pos, emphasis);
}

function intervalSessionKm(spec){
  if (spec.ladder) return round1(spec.ladder.reduce(function(a,b){return a+b;},0)/1000 + 4);
  if (spec.sets) return round1((spec.sets*spec.reps*spec.m)/1000 + 4);
  if (spec.m) return round1((spec.reps*spec.m)/1000 + 4);
  if (spec.hillSec) return round1((spec.reps*spec.hillSec*3.2)/1000 + 4);
  if (spec.fartlekMin) return round1(spec.reps*spec.fartlekMin*0.24 + 4);
  return 6;
}
function tempoSessionKm(spec){
  if (spec.km) return round1(spec.km + 3);
  if (spec.min) return round1(spec.min*0.185 + 3);
  return 6;
}

/* =========================================================
   BLOCK GENERATOR — the core "distance-agnostic" engine
   ========================================================= */
// Mandatory standard 14-day (2-week) taper ahead of race day, regardless of
// distance or total block length -- only shortened when the plan itself is
// too short to fit a full 2-week taper plus at least one build week.
function taperWeeksFor(planWeeks){
  if (planWeeks<=2) return 0;
  if (planWeeks===3) return 1;
  return 2;
}
function computeTaperInfo(planWeeks){
  var taper = taperWeeksFor(planWeeks);
  var buildWeeks = Math.max(1, planWeeks - taper - 1);
  if (buildWeeks + taper + 1 > planWeeks) taper = Math.max(0, planWeeks - buildWeeks - 1);
  return { taper:taper, buildWeeks:buildWeeks };
}
function isTaperWeek(weekNum){
  if (!state.setup) return false;
  var totalWeeks = totalWeeksInPlan();
  var info = computeTaperInfo(totalWeeks);
  return weekNum > info.buildWeeks && weekNum < totalWeeks;
}
function buildBlockWeeks(distKey, currentVolume, planWeeksInput){
  var profile = DISTANCE_PROFILES[distKey];
  // planWeeksInput must be the exact week-bucket count derived from the real
  // start-date -> race-date gap (see handleGeneratePlan) -- no hardcoded
  // default and no clamp, so short or long blocks are represented exactly.
  var N = Math.max(1, Math.round(planWeeksInput));
  var info = computeTaperInfo(N);
  var taper = info.taper, buildWeeks = info.buildWeeks;
  var peakVolume = currentVolume * profile.volMult;
  var weeks = [];

  for (var w=1; w<=N; w++){
    var isRace = (w===N);
    var isTaper = (!isRace && w>buildWeeks);
    var isCheckpoint = false;
    var volume, phase, isCutback=false;

    if (!isTaper && !isRace){
      var progress = w/buildWeeks;
      var trend = currentVolume + (peakVolume-currentVolume)*progress;
      isCutback = (w%4===0) && w!==buildWeeks && buildWeeks>=4;
      volume = isCutback ? trend*0.78 : trend;
      phase = progress<=0.25 ? 'Base' : (progress<=0.80 ? 'Build' : 'Peak');
      isCheckpoint = (w === Math.max(1,Math.round(buildWeeks*0.6)));
    } else if (isTaper){
      var taperIdx = w-buildWeeks;
      var frac = taper>0 ? taperIdx/taper : 1;
      volume = peakVolume*(1-frac*0.5);
      phase = 'Taper';
    } else {
      volume = peakVolume*0.35;
      phase = 'Race Week';
    }
    volume = round1(volume);

    var pos = buildWeeks>1 ? (Math.min(w,buildWeeks)-1)/(buildWeeks-1) : 0;
    var qSpec = pickQualityStructure(INTERVAL_STRUCTURE_POOL, phase, w, pos, profile.emphasis);
    var tSpec = pickQualityStructure(TEMPO_STRUCTURE_POOL, phase, w, pos, profile.emphasis);
    var qKm = intervalSessionKm(qSpec);
    var tKm = tempoSessionKm(tSpec);
    if (isRace){ qKm=0; tKm=0; }
    if (isTaper){ qKm=round1(qKm*0.6); tKm=round1(tKm*0.6); }

    var longFrac = LONG_FRACTION[profile.emphasis];
    var longTarget = isRace ? 0 : Math.min(profile.longCapKm, volume*longFrac);
    var b2bEligible = !!profile.backToBack && !isTaper && !isRace && phase!=='Base';

    var hasGoalSegment = !isRace && !isTaper && (profile.emphasis==='threshold'||profile.emphasis==='endurance') && phase!=='Base';
    var goalSegKm = hasGoalSegment ? round1(clamp(longTarget*(0.2+0.18*pos),3,longTarget*0.5)) : 0;

    var raceDayKm = isRace ? profile.raceKm : 0;

    weeks.push({
      week:w, phase:phase, isCutback:isCutback, isTaper:isTaper, isRace:isRace, isCheckpoint:isCheckpoint,
      volume:volume, qSpec:qSpec, qKm:qKm, tSpec:tSpec, tKm:tKm,
      longTarget:round1(longTarget), b2bEligible:b2bEligible,
      hasGoalSegment:hasGoalSegment, goalSegKm:goalSegKm, raceDayKm:raceDayKm
    });
  }
  return { profile:profile, weeks:weeks, peakVolume:round1(peakVolume), buildWeeks:buildWeeks, taperWeeks:taper, planWeeks:N };
}

/* =========================================================
   WORKOUT TEXT GENERATION
   ========================================================= */
function dtok(km){ return '@@D:'+km+'@@'; }
function resolveDesc(desc){
  if (!desc) return desc;
  return desc.replace(/@@D:([\d.]+)@@/g, function(_, km){ return fmtDist(parseFloat(km)); });
}
// For easy and long runs the description's LEADING distance is the whole-day
// distance, so it has to track dd.km after the generator settles that number
// -- smart rounding (roundWorkoutKm) and the weekly-volume cap both adjust km
// after the text was composed, which otherwise leaves a card reading "7.5km"
// on its target line and "7.3km @ Easy pace." directly underneath.
// Only the FIRST @@D:..@@ is rewritten: any later token is a segment (the
// goal-pace finish on a long run) that is deliberately smaller than the day
// total. Other workout types lead with genuine segment distances (warm-up,
// time-trial flanks, strides) and are left untouched, as is any description
// the runner has hand-edited -- the edit modal resolves tokens to plain text,
// so an edited description has none left to match.
function syncDescDistance(type, desc, km){
  if (!desc || (type!=='easy' && type!=='long')) return desc;
  return desc.replace(/@@D:[\d.]+@@/, dtok(round1(km)));
}

function intervalWorkoutText(spec){
  if (spec.ladder) return { title:'Ladder: '+spec.ladder.join('-')+'m', type:'interval',
    desc: dtok(2)+' warm-up. Ladder '+spec.ladder.join('–')+'m @ Interval pace, jog recovery scaled to each rep’s length. '+dtok(2)+' cool-down.' };
  if (spec.sets) return { title:'Deuce: '+spec.sets+'x('+spec.reps+'x'+spec.m+'m)', type:'interval',
    desc: dtok(2)+' warm-up. '+spec.sets+' sets of '+spec.reps+' x '+spec.m+'m @ Interval pace, short jog between reps, 3–4min jog between sets. '+dtok(2)+' cool-down.' };
  if (spec.t==='goalpace') return { title:'Goal Pace: '+spec.reps+'x'+spec.m+'m', type:'interval', mpSegment:true,
    desc: dtok(2)+' warm-up. '+spec.reps+' x '+spec.m+'m @ Goal Pace w/ short float recovery — locking in race rhythm. '+dtok(2)+' cool-down.' };
  if (spec.hillSec) return { title:'Hill Repeats '+spec.reps+'x'+spec.hillSec+'s', type:'interval',
    desc:'Easy warm-up. '+spec.reps+' x '+spec.hillSec+'s strong uphill effort, walk/jog back down to recover. Easy cool-down.' };
  if (spec.fartlekMin) return { title:'Fartlek '+spec.reps+'x'+spec.fartlekMin+'min', type:'interval',
    desc:'Easy warm-up. '+spec.reps+' x '+spec.fartlekMin+'min surges at a strong, controlled effort with an equal-time easy jog between. Easy cool-down.' };
  var type = spec.t || 'interval';
  var label = type==='repetition' ? 'Repetition' : 'Interval';
  var recovery = spec.m<=400 ? Math.round(spec.m/2)+'m jog' : (spec.m>=1000 ? '3min jog' : '90s jog');
  return { title: label+': '+spec.reps+'x'+spec.m+'m', type:type,
    desc: dtok(2)+' warm-up. '+spec.reps+' x '+spec.m+'m @ '+label+' pace w/ '+recovery+' recovery. '+dtok(2)+' cool-down.' };
}
function tempoWorkoutText(spec){
  if (spec.type==='goalpace') return { title:'Goal Pace Block: '+spec.km+'km', type:'tempo', mpSegment:true,
    desc: dtok(2)+' warm-up. '+dtok(spec.km)+' continuous @ Goal Pace — locked in and controlled, exactly race rhythm. '+dtok(2)+' cool-down.' };
  if (spec.type==='progressive') return { title:'Progressive Tempo: '+spec.min+'min', type:'tempo',
    desc:'Easy warm-up jog. '+spec.min+'min continuous, building steadily from a strong aerobic effort down to Tempo pace by the final third. Easy cool-down.' };
  if (spec.type==='steady') return { title:'Steady: '+spec.min+'min', type:'tempo',
    desc:'Easy warm-up jog. '+spec.min+'min continuous @ a strong, steady aerobic effort. Easy cool-down.' };
  if (spec.type==='tempo'){
    if (spec.split) return { title:'Tempo: '+spec.min+'min (split)', type:'tempo',
      desc: dtok(2)+' warm-up. '+Math.round(spec.min/spec.split)+'min @ Tempo pace x'+spec.split+', with 2-3min easy jog between reps. '+dtok(2)+' cool-down.' };
    return { title:'Tempo: '+spec.min+'min', type:'tempo',
      desc: dtok(2)+' warm-up. '+spec.min+'min continuous @ Tempo pace. '+dtok(2)+' cool-down.' };
  }
  return { title:'Threshold: '+spec.km+'km', type:'threshold',
    desc: dtok(2)+' warm-up. '+dtok(spec.km)+' continuous @ Threshold pace. '+dtok(1)+' cool-down.' };
}
function longRunText(km, hasGoalSegment, goalSegKm, isB2BPrimary, isB2BSecondary){
  if (isB2BSecondary){
    return { title:'Back-to-Back Long Run', type:'long', desc: dtok(km)+' @ Easy pace, on tired legs from yesterday \u2014 this specificity is what makes ultra training work.' };
  }
  var note = isB2BPrimary ? ' First of a back-to-back long-run weekend \u2014 keep it controlled.' : '';
  if (hasGoalSegment && goalSegKm>0){
    return { title:'Long Run + Goal Pace', type:'long', mpSegment:true,
      desc: dtok(km)+' @ Easy pace, last '+dtok(goalSegKm)+' @ Goal Pace.'+note };
  }
  return { title:'Long Run', type:'long', desc: dtok(km)+' @ Easy pace, steady and controlled.'+note };
}

/* =========================================================
   DAY-ARRAY BUILDER — lays the generated weeks onto real, calendar-
   aligned Monday-Sunday weeks, placing runs on the user's selected
   weekdays. Race day always lands on its real date regardless of
   the schedule; back-to-back only activates when the day after the
   long run is actually one of the runner's available days.
   ========================================================= */
var ISO_WEEKDAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function isoWeekday(dateStr){ var d = new Date(dateStr+'T00:00:00').getDay(); return d===0?6:d-1; }
// The user's very first available running day on/after dateStr -- this is
// always the real start of a generated block, never a backward-computed offset.
function firstActiveDayOnOrAfter(dateStr, activeDays){
  var d = dateStr;
  for (var i=0; i<7; i++){
    if (activeDays.indexOf(isoWeekday(d))!==-1) return d;
    d = addDays(d,1);
  }
  return dateStr;
}
function planLengthLabel(totalDays){
  var weeks = Math.floor(totalDays/7);
  var days = totalDays % 7;
  if (weeks<=0) return days+(days===1?' day':' days');
  if (days<=0) return weeks+(weeks===1?' week':' weeks');
  return weeks+(weeks===1?' week ':' weeks ')+days+(days===1?' day':' days');
}
function pickSpacedQty2(qty1, candidates){
  if (!candidates.length) return null;
  if (candidates.length===1) return candidates[0];
  var best=candidates[0], bestDist=-1;
  candidates.forEach(function(c){
    var d = Math.min(Math.abs(c-qty1), 7-Math.abs(c-qty1));
    if (d>bestDist){ bestDist=d; best=c; }
  });
  return best;
}
function buildDaysFromWeeks(blockResult, raceDateStr, schedule, startDateStr){
  var profile = blockResult.profile;
  var weeks = blockResult.weeks;

  var activeDays = schedule.activeDays.slice();
  var longDay = schedule.longRunDay;
  if (activeDays.indexOf(longDay)===-1) activeDays.push(longDay);
  var activeSet = {}; activeDays.forEach(function(d){ activeSet[d]=true; });
  var b2bDay = (longDay+1)%7;
  var b2bAvailable = !!profile.backToBack && activeSet[b2bDay] && b2bDay!==longDay;

  var nonLongActive = activeDays.filter(function(d){ return d!==longDay; }).sort(function(a,b){return a-b;});
  // reserve the back-to-back day out of the quality-session pool when this distance uses it, so a hard
  // session never lands on the same day back-to-back training needs -- unless that leaves too few days
  var qtyPool = (b2bAvailable && nonLongActive.length>2) ? nonLongActive.filter(function(d){return d!==b2bDay;}) : nonLongActive;
  var qty1Day = qtyPool.length ? qtyPool[0] : null;
  var qty2Day = qty1Day!=null ? pickSpacedQty2(qty1Day, qtyPool.filter(function(d){return d!==qty1Day;})) : null;
  var easyDaysBase = nonLongActive.filter(function(d){ return d!==qty1Day && d!==qty2Day; });

  var raceIso = isoWeekday(raceDateStr);
  // Anchor forward from the real start date's calendar week instead of counting
  // backward from the race date -- days before startDateStr are skipped below
  // rather than never generated, so the plan never gets pushed into the past.
  var startMonday = addDays(startDateStr, -isoWeekday(startDateStr));

  var days = [];
  weeks.forEach(function(wk, wIdx){
    var weekMonday = addDays(startMonday, wIdx*7);

    if (wk.isRace){
      var leadUpIsos = activeDays.filter(function(d){ return d!==raceIso; });
      var perLeadUp = leadUpIsos.length ? Math.max(2, round1(wk.volume/leadUpIsos.length)) : 0;
      for (var ir=0; ir<7; ir++){
        var dr = addDays(weekMonday, ir);
        if (dr<startDateStr) continue;
        if (dr>raceDateStr) continue; // plan ends exactly at the target race date, never past it
        var isRD = (dr===raceDateStr);
        var obj;
        if (isRD){
          obj = { type:'race', title: profile.label+' Race Day', km: wk.raceDayKm,
            desc:'Even effort through the first two-thirds, then give whatever is left. Target: Goal Pace throughout.', mpSegment:true };
        } else if (!activeSet[ir]){
          obj = { type:'rest', title:'Rest Day', km:0, desc:'Full rest.' };
        } else if (ir===qty1Day){
          obj = { type:'interval', title:'Sharpen: 6x100m Strides', km:perLeadUp,
            desc: dtok(Math.max(0,round1(perLeadUp-1)))+' @ Easy pace, then 6x100m relaxed strides w/ full recovery. Short and sharp.' };
        } else if (dr===addDays(raceDateStr,-1)){
          obj = { type:'easy', title:'Pre-Race Shakeout', km:Math.min(4,perLeadUp),
            desc:'Short and easy with a few relaxed strides. Lay out race kit, eat familiar food, sleep early.' };
        } else {
          obj = { type:'easy', title:'Easy Aerobic', km:perLeadUp, desc:dtok(perLeadUp)+' @ Easy pace.' };
        }
        days.push({ id:dr, date:dr, week:wk.week, type:obj.type, title:obj.title, km:roundWorkoutKm(obj.type, obj.km), desc:obj.desc,
          mpSegment:!!obj.mpSegment, completed:false, actual:{km:null,pace:null,hr:null,rpe:null,notes:''} });
      }
      return;
    }

    var b2bActive = wk.b2bEligible && b2bAvailable;
    var longKm, secondLongKm=0;
    if (b2bActive){ longKm=round1(wk.longTarget*0.62); secondLongKm=round1(wk.longTarget*0.38); }
    else { longKm = round1(wk.longTarget); }

    // this week's real easy-day pool: drop the b2b day from it on weeks where b2b actually fires,
    // since that day's volume comes from secondLongKm instead, not the generic easy budget
    var easyDays = b2bActive ? easyDaysBase.filter(function(d){return d!==b2bDay;}) : easyDaysBase;

    var usedBeforeEasy = wk.qKm+wk.tKm+longKm+secondLongKm;
    var remainder = Math.max(0, wk.volume-usedBeforeEasy);
    var perEasy = 0;
    var qKmThisWeek = wk.qKm, tKmThisWeek = wk.tKm;
    if (easyDays.length>0){
      perEasy = Math.max(3, round1(remainder/easyDays.length));
    } else {
      var room = Math.max(0, profile.longCapKm-longKm);
      var addToLong = Math.min(room, remainder);
      longKm = round1(longKm+addToLong);
      remainder = Math.max(0, remainder-addToLong);
      qKmThisWeek = round1(wk.qKm + remainder*0.5);
      tKmThisWeek = round1(wk.tKm + remainder*0.5);
    }

    for (var iso=0; iso<7; iso++){
      var date = addDays(weekMonday, iso);
      if (date<startDateStr) continue;
      var dayObj;
      if (iso===longDay && activeSet[iso]){
        var tl = longRunText(longKm, wk.hasGoalSegment, wk.goalSegKm, b2bActive, false);
        dayObj = { type:tl.type, title:tl.title, km:longKm, desc:tl.desc, mpSegment:!!tl.mpSegment };
      } else if (b2bActive && iso===b2bDay){
        var t2 = longRunText(secondLongKm, false, 0, false, true);
        dayObj = { type:t2.type, title:t2.title, km:secondLongKm, desc:t2.desc };
      } else if (activeSet[iso] && iso===qty1Day){
        var q = intervalWorkoutText(wk.qSpec);
        dayObj = { type:q.type, title:q.title, km:qKmThisWeek, desc:q.desc, mpSegment:!!q.mpSegment };
      } else if (activeSet[iso] && iso===qty2Day){
        if (wk.isCheckpoint){
          var ttKm = Math.min(TT_DISTANCE_KM[profile.emphasis], Math.max(2, round1(tKmThisWeek-3)));
          var flank = Math.max(1, round1((tKmThisWeek-ttKm)/2));
          dayObj = { type:'checkpoint', title:'Fitness Checkpoint: '+ttKm+'km Time Trial', km:tKmThisWeek,
            desc: dtok(flank)+' warm-up, '+dtok(ttKm)+' at hard, honest effort, '+dtok(flank)+' cool-down. Use today\u2019s time to reconsider your Active Goal for the rest of the block.' };
        } else {
          var t3 = tempoWorkoutText(wk.tSpec);
          dayObj = { type:t3.type, title:t3.title, km:tKmThisWeek, desc:t3.desc, mpSegment:!!t3.mpSegment };
        }
      } else if (activeSet[iso]){
        dayObj = { type:'easy', title:'Easy Aerobic', km:perEasy, desc:dtok(perEasy)+' @ Easy pace.' };
      } else {
        dayObj = { type:'rest', title:'Rest Day', km:0, desc:'Full rest. Legs up, hydrate, stay ahead of the block.' };
      }
      days.push({ id:date, date:date, week:wk.week, type:dayObj.type, title:dayObj.title, km:roundWorkoutKm(dayObj.type, dayObj.km), desc:dayObj.desc,
        mpSegment:!!dayObj.mpSegment, completed:false, actual:{km:null,pace:null,hr:null,rpe:null,notes:''} });
    }
  });
  capWeeklyVolume(days, weeks);
  // Single settle-up pass, deliberately last: km is final only once smart
  // rounding AND the weekly-volume cap have both had their say, so syncing
  // the descriptions here catches every adjustment in one place rather than
  // needing a fix-up at each individual site that touches km.
  days.forEach(function(dd){ dd.desc = syncDescDistance(dd.type, dd.desc, dd.km); });
  return days;
}
// Smart rounding above can push a week's total past its calculated
// baseline by more than the generator intended. Trim easy days first
// (never below the generator's own 3km floor), and only touch the long
// run as a last resort, never below 70% of its pre-cap distance. Race
// week is exempt -- its total is the race distance itself, not a volume
// target to police.
function capWeeklyVolume(days, weeks){
  var weekIndex = {};
  weeks.forEach(function(wk){ weekIndex[wk.week] = wk; });
  var byWeek = {};
  days.forEach(function(dd){
    (byWeek[dd.week] = byWeek[dd.week] || []).push(dd);
  });
  Object.keys(byWeek).forEach(function(wNum){
    var wk = weekIndex[wNum];
    if (!wk || wk.isRace) return;
    var entries = byWeek[wNum];
    var cap = wk.volume * 1.03;
    var total = function(){ return entries.reduce(function(s,dd){ return s + dd.km; }, 0); };
    if (total() <= cap) return;
    // trim easy days one clean 0.5km step at a time, always the largest
    // easy day first, never below the generator's own 3km floor
    var easyEntries = entries.filter(function(dd){ return dd.type==='easy'; });
    var guard = 0;
    while (total() > cap && guard < 200){
      guard++;
      var target = easyEntries.reduce(function(best,dd){ return (dd.km>3 && (!best||dd.km>best.km)) ? dd : best; }, null);
      if (!target) break;
      target.km = round1(target.km - 0.5);
    }
    // last resort: trim the week's long run one clean 1km step at a time,
    // never below 70% of its pre-cap distance
    if (total() > cap){
      var longEntry = entries.filter(function(dd){ return dd.type==='long'; }).sort(function(a,b){ return b.km-a.km; })[0];
      if (longEntry){
        var floor = Math.round(longEntry.km * 0.7);
        var guard2 = 0;
        while (total() > cap && longEntry.km > floor && guard2 < 100){
          guard2++;
          longEntry.km = longEntry.km - 1;
        }
      }
    }
  });
}

/* =========================================================
   STORAGE — localStorage (this app is deployed standalone on
   Vercel for the user's friends/wife, not viewed only inside
   Claude, so real browser storage is the correct choice here).
   Wrapped defensively: if localStorage is unavailable (private
   browsing, restricted preview contexts, etc.) the app falls
   back to in-memory state for that session rather than breaking.
   ========================================================= */
var storageAvailable = false;
try{
  var __t = '__vv_test__';
  window.localStorage.setItem(__t,'1');
  window.localStorage.removeItem(__t);
  storageAvailable = true;
}catch(e){ storageAvailable = false; }

var state = null;
var saveTimer = null;
function scheduleSave(){
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(persistState, 450);
}
function persistState(){
  if (!storageAvailable) return;
  try{ window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('Save failed', e); showToast('Couldn\u2019t save \u2014 storage may be full or unavailable'); }
  // mirror upward only after the local write has succeeded; no-ops unless
  // cloud sync is configured and signed in
  scheduleCloudPush();
}
// Write immediately instead of waiting out scheduleSave's debounce, and
// first commit whatever field is being edited. Two ways the last thing a
// runner did could otherwise be lost when the app closes:
//   1. scheduleSave debounces 450ms with nothing forcing it to run, and
//      backgrounding can freeze the pending timer entirely -- so tapping
//      the complete box and immediately swiping the app away dropped it.
//   2. log fields commit on 'change', which for text means on blur, so
//      closing with the cursor still in Notes meant that text never even
//      reached state -- no amount of waiting would have saved it.
// Bound to pagehide and to visibilitychange->hidden, since mobile browsers
// frequently kill a backgrounded page without ever firing pagehide.
function flushSave(){
  var el = document.activeElement;
  if (el && el.getAttribute && el.getAttribute('data-action')==='actual-field'){
    handleActualFieldChange(el.getAttribute('data-day'), el.getAttribute('data-field'), el.value);
  }
  if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  persistState();
}
/* =========================================================
   CLOUD SYNC (optional) — accounts + cross-device backup.
   Inactive until SUPABASE_URL/ANON_KEY are filled in; with them blank
   every function here no-ops and this is exactly the local-only app it
   has always been.

   Design rules, in priority order:
     1. localStorage stays authoritative. The boot path is untouched and
        still synchronous, so the app paints instantly and a cloud outage
        can never delay or break startup.
     2. A failed cloud read must NEVER destroy local data -- reconcile
        runs only on a successful fetch.
     3. Nothing is discarded silently. When a device and an account hold
        two different plans the runner is asked which to keep, and the
        other is stashed under CLOUD_BACKUP_KEY rather than dropped.

   Talks to Supabase's REST/GoTrue endpoints directly with fetch instead
   of loading their SDK, so the app keeps its no-build-step, no-CDN,
   nothing-to-rot property.
   ========================================================= */
var SUPABASE_URL = '';       // e.g. https://xxxxxxxx.supabase.co
var SUPABASE_ANON_KEY = '';  // the public "anon" key -- safe in client code
var CLOUD_SESSION_KEY = 'vvv_cloud_session';
var CLOUD_BACKUP_KEY = 'vvv_cloud_displaced_plan';
var cloudSession = null;   // { access_token, refresh_token, expires_at, email, user_id }
var cloudStatus = 'off';   // off | signed-out | syncing | synced | error
var cloudPushTimer = null;

function cloudConfigured(){ return !!(SUPABASE_URL && SUPABASE_ANON_KEY); }
function cloudSignedIn(){ return !!(cloudSession && cloudSession.access_token); }

function readStored(key){
  if (!storageAvailable) return null;
  try{ var r = window.localStorage.getItem(key); return r ? JSON.parse(r) : null; }catch(e){ return null; }
}
function writeStored(key, val){
  if (!storageAvailable) return;
  try{ if (val==null) window.localStorage.removeItem(key); else window.localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

function cloudFetch(path, opts){
  opts = opts || {};
  var headers = { 'apikey':SUPABASE_ANON_KEY, 'content-type':'application/json' };
  if (opts.headers) Object.keys(opts.headers).forEach(function(k){ headers[k] = opts.headers[k]; });
  if (opts.auth!==false && cloudSignedIn()) headers['Authorization'] = 'Bearer '+cloudSession.access_token;
  return fetch(SUPABASE_URL.replace(/\/$/,'')+path, { method:opts.method||'GET', headers:headers, body:opts.body });
}

/* ---------- auth: email magic link, so there is no password to store or leak ---------- */
function cloudSendMagicLink(email){
  var redirect = window.location.origin + window.location.pathname;
  return cloudFetch('/auth/v1/otp', {
    method:'POST', auth:false,
    body: JSON.stringify({ email:email, create_user:true, options:{ email_redirect_to:redirect } })
  }).then(function(resp){
    if (!resp.ok) throw new Error('Could not send the sign-in link');
  });
}
// Supabase returns tokens in the URL fragment. Consume and strip them so they
// never linger in history or travel inside a copied link.
function cloudConsumeAuthHash(){
  var hash = window.location.hash || '';
  if (hash.indexOf('access_token=')===-1) return false;
  var p = {};
  hash.replace(/^#/,'').split('&').forEach(function(kv){
    var i = kv.indexOf('=');
    if (i>0) p[decodeURIComponent(kv.slice(0,i))] = decodeURIComponent(kv.slice(i+1));
  });
  if (!p.access_token) return false;
  cloudSetSession({
    access_token:p.access_token, refresh_token:p.refresh_token,
    expires_at: Date.now() + (parseInt(p.expires_in,10)||3600)*1000
  });
  try{ window.history.replaceState(null, '', window.location.pathname + window.location.search); }catch(e){}
  return true;
}
function cloudSetSession(sess){
  cloudSession = sess;
  writeStored(CLOUD_SESSION_KEY, sess);
}
function cloudLoadUser(){
  return cloudFetch('/auth/v1/user').then(function(resp){
    if (!resp.ok) return null;
    return resp.json().then(function(u){
      if (u && u.id){
        cloudSession.user_id = u.id; cloudSession.email = u.email;
        cloudSetSession(cloudSession);
      }
      return u;
    });
  });
}
function cloudRefreshIfNeeded(){
  if (!cloudSignedIn()) return Promise.resolve(false);
  if (cloudSession.expires_at && Date.now() < cloudSession.expires_at - 60000) return Promise.resolve(true);
  if (!cloudSession.refresh_token) return Promise.resolve(false);
  return cloudFetch('/auth/v1/token?grant_type=refresh_token', {
    method:'POST', auth:false, body: JSON.stringify({ refresh_token:cloudSession.refresh_token })
  }).then(function(resp){
    if (!resp.ok) return false;
    return resp.json().then(function(t){
      if (!t.access_token) return false;
      cloudSetSession({
        access_token:t.access_token, refresh_token:t.refresh_token||cloudSession.refresh_token,
        expires_at: Date.now() + (t.expires_in||3600)*1000,
        user_id:cloudSession.user_id, email:cloudSession.email
      });
      return true;
    });
  }).catch(function(){ return false; });
}
function cloudSignOut(){
  cloudSession = null;
  writeStored(CLOUD_SESSION_KEY, null);
  cloudStatus = 'signed-out';
  patchCloudCard();
  showToast('Signed out — your plan stays on this device');
}

/* ---------- the plan row ---------- */
function cloudGetPlan(){
  return cloudFetch('/rest/v1/plans?select=data,updated_at&limit=1').then(function(resp){
    if (!resp.ok) throw new Error('fetch failed');
    return resp.json();
  }).then(function(rows){ return (rows && rows[0]) || null; });
}
function cloudPutPlan(){
  if (!cloudSignedIn() || !cloudSession.user_id) return Promise.resolve();
  return cloudFetch('/rest/v1/plans', {
    method:'POST',
    headers:{ 'Prefer':'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({ user_id:cloudSession.user_id, data:state, updated_at:new Date().toISOString() })
  }).then(function(resp){ if (!resp.ok) throw new Error('push failed'); });
}
// Debounced so a burst of log edits produces one upload, and always fired
// AFTER the local write -- local is the source of truth, the cloud a mirror.
function scheduleCloudPush(){
  if (!cloudConfigured() || !cloudSignedIn()) return;
  if (cloudPushTimer) clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(function(){
    cloudPushTimer = null;
    cloudRefreshIfNeeded().then(function(ok){
      if (!ok) return null;
      return cloudPutPlan().then(function(){ cloudStatus='synced'; patchCloudCard(); });
    }).catch(function(){ cloudStatus='error'; patchCloudCard(); });
  }, 1500);
}

/* ---------- reconcile ---------- */
function planSummary(st){
  if (!st || !st.setup) return 'empty plan';
  var p = DISTANCE_PROFILES[st.setup.distanceKey];
  var done = (st.days||[]).filter(function(d){ return d.completed; }).length;
  return (p?p.label:'Plan')+', race '+(st.setup.raceDate||'?')+', '+done+' session'+(done===1?'':'s')+' logged';
}
function adoptCloudState(remote){
  writeStored(CLOUD_BACKUP_KEY, state);   // never discard what was already here
  state = remote;
  if (state.view==='detailed') state.view='planhq';
  if (!state.view) state.view='today';
  if (state.notifyEnabled==null) state.notifyEnabled=false;
  initExpanded();
  persistState();
  renderApp();
}
// Reached only with a SUCCESSFUL fetch, so a network failure can never take
// a plan away.
function cloudReconcile(){
  return cloudGetPlan().then(function(row){
    var localHasPlan = !!(state.setup && state.days && state.days.length);
    var remote = row && row.data;
    var remoteHasPlan = !!(remote && remote.setup && remote.days && remote.days.length);

    if (!remoteHasPlan){
      cloudStatus='synced';
      var seed = localHasPlan ? cloudPutPlan().catch(function(){ cloudStatus='error'; }) : Promise.resolve();
      return seed.then(patchCloudCard);
    }
    if (!localHasPlan){
      adoptCloudState(remote);                      // a new device pulls the plan down
      cloudStatus='synced'; patchCloudCard();
      showToast('Plan restored from your account');
      return;
    }
    if (JSON.stringify(remote)===JSON.stringify(state)){
      cloudStatus='synced'; patchCloudCard();
      return;
    }
    // Two different real plans. Never guess -- ask, and keep the loser.
    openCloudConflictModal(remote, row.updated_at);
  }).catch(function(){ cloudStatus='error'; patchCloudCard(); });
}
function openCloudConflictModal(remote, remoteUpdated){
  window.__cloudPendingRemote = remote;
  openModal(''+
  '<div class="modal-head"><h2 class="font-head">Two plans found</h2></div>'+
  '<div class="modal-body">'+
    '<div class="field-hint" style="margin-bottom:12px;">This device and your account each hold a different training block. Choose which to keep — the other is kept as a backup on this device, not deleted.</div>'+
    '<div class="setup-section-title">On this device</div>'+
    '<div class="callout" style="margin-bottom:12px;">'+escapeHtml(planSummary(state))+'</div>'+
    '<div class="setup-section-title">In your account</div>'+
    '<div class="callout" style="margin-bottom:16px;">'+escapeHtml(planSummary(remote))+'</div>'+
    '<button type="button" class="btn btn-primary btn-block" style="margin-bottom:8px;" data-action="cloud-keep-local">Keep this device’s plan</button>'+
    '<button type="button" class="btn btn-ghost btn-block" data-action="cloud-keep-remote">Use my account’s plan</button>'+
  '</div>');
}
function handleCloudKeepLocal(){
  closeModal();
  window.__cloudPendingRemote = null;
  cloudPutPlan().then(function(){
    cloudStatus='synced'; patchCloudCard();
    showToast('This device’s plan is now the one in your account');
  }).catch(function(){ cloudStatus='error'; patchCloudCard(); });
}
function handleCloudKeepRemote(){
  var remote = window.__cloudPendingRemote;
  window.__cloudPendingRemote = null;
  closeModal();
  if (remote) adoptCloudState(remote);
  cloudStatus='synced'; patchCloudCard();
  showToast('Switched to your account’s plan — the other is backed up on this device');
}

function cloudInit(){
  if (!cloudConfigured()){ cloudStatus='off'; return Promise.resolve(); }
  cloudConsumeAuthHash();
  if (!cloudSession) cloudSession = readStored(CLOUD_SESSION_KEY);
  if (!cloudSignedIn()){ cloudStatus='signed-out'; patchCloudCard(); return Promise.resolve(); }
  cloudStatus='syncing'; patchCloudCard();
  return cloudRefreshIfNeeded().then(function(ok){
    if (!ok){ cloudSignOut(); return null; }
    var who = cloudSession.user_id ? Promise.resolve() : cloudLoadUser();
    return who.then(cloudReconcile);
  });
}

function loadState(){
  if (storageAvailable){
    try{
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw){
        var parsed = JSON.parse(raw);
        if (parsed && parsed.setup && parsed.days){
          // 'detailed' was the old key for today's 'planhq' tab; older saves
          // predating the bottom-nav toggle entirely have no view at all --
          // both now land on 'today', the current default landing tab.
          if (parsed.view==='detailed') parsed.view = 'planhq';
          else if (!parsed.view) parsed.view = 'today';
          if (parsed.notifyEnabled==null) parsed.notifyEnabled = false;
          state = parsed;
          return;
        }
      }
    }catch(e){ /* corrupt or unavailable — fall through to fresh state */ }
  }
  state = makeDefaultState();
}
function makeDefaultState(){
  return {
    theme:'dark',
    units:'km',
    view:'today', // 'today' | 'week' | 'full' | 'planhq' | 'settings' -- which bottom-nav view is active
    setup:null, // { distanceKey, currentVolume, raceDate, benchmark:{distanceKey,timeSec}, goals:{A,B,C:{label,timeSec}}, activeGoal:'A' }
    days:[],
    notifyEnabled:false // daily 08:00 workout-reminder notification toggle
  };
}
