/* =========================================================
   FILE PARSERS — GPX / CSV / FIT (ported, distance-agnostic)
   ========================================================= */
function haversineKm(lat1,lon1,lat2,lon2){
  var R = 6371;
  var dLat = (lat2-lat1) * Math.PI/180;
  var dLon = (lon2-lon1) * Math.PI/180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180) *
          Math.sin(dLon/2)*Math.sin(dLon/2);
  var c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R*c;
}

function parseGPX(text){
  var doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('That file doesn\u2019t look like valid GPX.');
  var trkpts = Array.prototype.slice.call(doc.getElementsByTagName('trkpt'));
  if (!trkpts.length) throw new Error('No track points found in this GPX file.');
  var totalDist = 0, prev = null, hrSum = 0, hrCount = 0, times = [];
  trkpts.forEach(function(pt){
    var lat = parseFloat(pt.getAttribute('lat'));
    var lon = parseFloat(pt.getAttribute('lon'));
    var timeEls = pt.getElementsByTagName('time');
    if (timeEls.length) { var t = new Date(timeEls[0].textContent); if (!isNaN(t)) times.push(t); }
    var all = pt.getElementsByTagName('*');
    for (var i=0;i<all.length;i++){
      if (all[i].localName === 'hr'){
        var v = parseFloat(all[i].textContent);
        if (!isNaN(v)) { hrSum += v; hrCount++; }
        break;
      }
    }
    if (prev && !isNaN(lat) && !isNaN(lon)) totalDist += haversineKm(prev.lat, prev.lon, lat, lon);
    if (!isNaN(lat) && !isNaN(lon)) prev = {lat:lat, lon:lon};
  });
  var durationSec = times.length>=2 ? (times[times.length-1]-times[0])/1000 : null;
  var paceSecPerKm = (durationSec && totalDist>0.05) ? durationSec/totalDist : null;
  var date = times.length ? times[0].toISOString().slice(0,10) : null;
  return {
    source:'GPX', date: date,
    km: round1(totalDist),
    pace: paceSecPerKm ? secToPace(paceSecPerKm) : null,
    hr: hrCount ? Math.round(hrSum/hrCount) : null,
    durationSec: durationSec
  };
}

function parseTCX(text){
  var doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('That file doesn’t look like valid TCX.');
  var laps = Array.prototype.slice.call(doc.getElementsByTagName('Lap'));
  if (!laps.length) throw new Error('No laps found in this TCX file.');
  var totalDist = 0, totalTime = 0, startTime = null;
  laps.forEach(function(lap){
    var st = lap.getAttribute('StartTime');
    if (st && !startTime) startTime = st;
    var distEl = lap.getElementsByTagName('DistanceMeters')[0];
    var timeEl = lap.getElementsByTagName('TotalTimeSeconds')[0];
    if (distEl) totalDist += parseFloat(distEl.textContent) || 0;
    if (timeEl) totalTime += parseFloat(timeEl.textContent) || 0;
  });
  if (!startTime){
    var idEl = doc.getElementsByTagName('Id')[0];
    if (idEl) startTime = idEl.textContent;
  }
  var hrSum = 0, hrCount = 0;
  var hrEls = doc.getElementsByTagName('HeartRateBpm');
  for (var i=0;i<hrEls.length;i++){
    var valEl = hrEls[i].getElementsByTagName('Value')[0];
    if (valEl){ var v = parseFloat(valEl.textContent); if (!isNaN(v)){ hrSum += v; hrCount++; } }
  }
  var km = totalDist/1000;
  var paceSecPerKm = (totalTime && km>0.05) ? totalTime/km : null;
  var date = null;
  if (startTime){ var d = new Date(startTime); if (!isNaN(d)) date = d.toISOString().slice(0,10); }
  return {
    source:'TCX', date: date,
    km: round1(km),
    pace: paceSecPerKm ? secToPace(paceSecPerKm) : null,
    hr: hrCount ? Math.round(hrSum/hrCount) : null,
    durationSec: totalTime || null
  };
}

function splitCSVLine(line){
  var out = [], cur = '', inQ = false;
  for (var i=0;i<line.length;i++){
    var ch = line[i];
    if (ch === '"'){
      if (inQ && line[i+1] === '"'){ cur+='"'; i++; }
      else inQ = !inQ;
    } else if (ch === ',' && !inQ){
      out.push(cur); cur='';
    } else cur += ch;
  }
  out.push(cur);
  return out;
}

function parseCSV(text){
  var lines = text.split(/\r?\n/).filter(function(l){ return l.trim().length; });
  if (lines.length < 2) throw new Error('This CSV doesn\u2019t have any data rows.');
  var headers = splitCSVLine(lines[0]).map(function(h){ return h.trim().toLowerCase(); });
  var find = function(subs){
    for (var i=0;i<headers.length;i++){
      for (var j=0;j<subs.length;j++){ if (headers[i].indexOf(subs[j]) !== -1) return i; }
    }
    return -1;
  };
  var distIdx = find(['distance']);
  var hrIdx = find(['average heart', 'avg heart', 'heart rate', 'heart_rate']);
  var paceIdx = find(['average pace','avg pace','pace']);
  var speedIdx = find(['average speed','avg speed','speed']);
  var dateIdx = find(['date','start time','activity date']);
  var rows = [];
  for (var r=1;r<lines.length;r++){
    var cells = splitCSVLine(lines[r]);
    if (!cells.some(function(c){return c.trim().length;})) continue;
    var kmRaw = distIdx!==-1 ? parseFloat(cells[distIdx]) : null;
    var paceStr = paceIdx!==-1 ? cells[paceIdx].trim() : null;
    var speedRaw = speedIdx!==-1 ? parseFloat(cells[speedIdx]) : null;
    var hrRaw = hrIdx!==-1 ? parseFloat(cells[hrIdx]) : null;
    var dateRaw = dateIdx!==-1 ? cells[dateIdx].trim() : null;
    var pace = null;
    if (paceStr && /^\d+:\d+/.test(paceStr)) pace = paceStr.match(/\d+:\d+/)[0];
    else if (speedRaw && speedRaw>0) pace = secToPace(3600/speedRaw > 1000 ? null : (60/speedRaw)*60 ); // speed assumed km/h -> sec/km
    var isoDate = null;
    if (dateRaw){
      var pd = new Date(dateRaw);
      if (!isNaN(pd)) isoDate = pd.toISOString().slice(0,10);
    }
    if (kmRaw || pace || hrRaw){
      rows.push({
        date: isoDate, dateRaw: dateRaw,
        km: (kmRaw && !isNaN(kmRaw)) ? round1(kmRaw) : null,
        pace: pace,
        hr: (hrRaw && !isNaN(hrRaw)) ? Math.round(hrRaw) : null
      });
    }
  }
  if (!rows.length) throw new Error('Couldn\u2019t find distance, pace or heart-rate columns in this CSV.');
  return { source:'CSV', rows: rows };
}

var FIT_EPOCH_OFFSET = 631065600; // seconds between Unix epoch and FIT epoch (1989-12-31T00:00:00Z)

function fitReadField(view, offset, size, baseType, le){
  try{
    switch(baseType){
      case 0x00: case 0x02: case 0x0A: return view.getUint8(offset);
      case 0x01: return view.getInt8(offset);
      case 0x84: case 0x8B: return size>=2 ? view.getUint16(offset, le) : view.getUint8(offset);
      case 0x83: return view.getInt16(offset, le);
      case 0x86: case 0x8C: return size>=4 ? view.getUint32(offset, le) : view.getUint16(offset, le);
      case 0x85: return view.getInt32(offset, le);
      case 0x88: return view.getFloat32(offset, le);
      case 0x89: return view.getFloat64(offset, le);
      default: return null; // strings / byte arrays not needed for our summary fields
    }
  }catch(e){ return null; }
}

function parseFIT(buffer){
  var view = new DataView(buffer);
  var headerSize = view.getUint8(0);
  var sig = String.fromCharCode(view.getUint8(8),view.getUint8(9),view.getUint8(10),view.getUint8(11));
  if (sig !== '.FIT') throw new Error('That file doesn\u2019t look like a valid FIT file.');
  var dataSize = view.getUint32(4, true);
  var offset = headerSize;
  var end = Math.min(headerSize + dataSize, view.byteLength);
  var localDefs = {};
  var records = [];
  var sessionMsg = null;
  var guard = 0;

  while (offset < end && guard < 200000){
    guard++;
    var header = view.getUint8(offset); offset += 1;
    if (header & 0x80){ break; } // compressed-timestamp header stream — not supported, stop gracefully with whatever we parsed so far
    var isDef = (header & 0x40) !== 0;
    var localType = header & 0x0F;
    if (isDef){
      offset += 1; // reserved
      var arch = view.getUint8(offset); offset += 1;
      var le = (arch === 0);
      var globalNum = le ? view.getUint16(offset,true) : view.getUint16(offset,false); offset += 2;
      var numFields = view.getUint8(offset); offset += 1;
      var fields = [];
      for (var i=0;i<numFields;i++){
        fields.push({ defNum: view.getUint8(offset), size: view.getUint8(offset+1), baseType: view.getUint8(offset+2) });
        offset += 3;
      }
      var devFields = [];
      if (header & 0x20){
        var numDev = view.getUint8(offset); offset += 1;
        for (var j=0;j<numDev;j++){ devFields.push({ size: view.getUint8(offset+1) }); offset += 3; }
      }
      localDefs[localType] = { globalNum: globalNum, le: le, fields: fields, devFields: devFields };
    } else {
      var def = localDefs[localType];
      if (!def){ break; }
      var msg = {};
      for (var k=0;k<def.fields.length;k++){
        var f = def.fields[k];
        msg[f.defNum] = fitReadField(view, offset, f.size, f.baseType, def.le);
        offset += f.size;
      }
      for (var dv=0; dv<def.devFields.length; dv++){ offset += def.devFields[dv].size; }
      if (def.globalNum === 20) records.push(msg);
      if (def.globalNum === 18) sessionMsg = msg;
    }
  }

  var kmVal=null, paceVal=null, hrVal=null, dateVal=null;
  if (sessionMsg){
    if (sessionMsg[9] != null) kmVal = round1(sessionMsg[9] / 100 / 1000);
    if (sessionMsg[16] != null) hrVal = sessionMsg[16];
    if (sessionMsg[7] != null && kmVal){ paceVal = secToPace((sessionMsg[7]/1000) / kmVal); }
    if (sessionMsg[253] != null) dateVal = new Date((sessionMsg[253]+FIT_EPOCH_OFFSET)*1000).toISOString().slice(0,10);
  } else if (records.length){
    var last = records[records.length-1];
    var first = records[0];
    if (last[5] != null) kmVal = round1(last[5]/100/1000);
    var hrs = records.map(function(r){return r[3];}).filter(function(v){return v!=null;});
    if (hrs.length) hrVal = Math.round(hrs.reduce(function(a,b){return a+b;},0)/hrs.length);
    if (first[253]!=null && last[253]!=null && kmVal){
      var durSec = last[253]-first[253];
      if (durSec>0) paceVal = secToPace(durSec/kmVal);
    }
    if (first[253]!=null) dateVal = new Date((first[253]+FIT_EPOCH_OFFSET)*1000).toISOString().slice(0,10);
  }
  if (kmVal==null && hrVal==null) throw new Error('Couldn\u2019t find a distance or heart-rate summary in this FIT file.');
  return { source:'FIT', date:dateVal, km:kmVal, pace:paceVal, hr:hrVal };
}

function showToast(msg){

/* =========================================================
   GOAL / VDOT RESOLUTION (resolve-at-render, same pattern as
   the original pace ladder: change a goal, everything downstream
   \u2014 every workout target and the pacing modal \u2014 updates instantly)
   ========================================================= */
function getGoal(key){ return (state.setup && state.setup.goals) ? state.setup.goals[key] : null; }
function getActiveGoal(){ return state.setup ? getGoal(state.setup.activeGoal) : null; }
function getActiveVDOT(){
  var g = getActiveGoal();
  if (!g || !g.timeSec || !state.setup) return null;
  var profile = DISTANCE_PROFILES[state.setup.distanceKey];
  return vdotFromPerformance(profile.raceKm*1000, g.timeSec);
}
// Zone paces are calculated from VDOT by default, but each zone's slow/fast
// bound can be manually overridden (state.setup.paceOverrides) from the main
// dashboard card -- an override only takes effect once both bounds are set,
// so a half-edited zone never falls back to a nonsensical mixed range.
function getActivePaces(){
  var base = trainingPacesFromVDOT(getActiveVDOT());
  var overrides = (state.setup && state.setup.paceOverrides) || {};
  var out = {};
  Object.keys(base).forEach(function(k){
    var o = overrides[k];
    out[k] = (o && o.slow!=null && o.fast!=null) ? { slow:o.slow, fast:o.fast } : base[k];
  });
  return out;
}
function getGoalPaceSecPerKm(){
  var vdot = getActiveVDOT();
  if (!vdot || !state.setup) return null;
  var profile = DISTANCE_PROFILES[state.setup.distanceKey];
  return goalPaceSecPerKm(vdot, profile.raceKm*1000);
}
function getDayTargets(dd){
  var tm = TYPE_META[dd.type];
  var out = { pace:null, goalPace:null, hr:null };
  var paces = getActivePaces();
  // Target HR for the session, from the same zone the Execution Score grades
  // against -- resolved here rather than in renderDayCard so every view that
  // reads a day's targets gets it from one place. Null (and so omitted) for
  // rest/race days, which have no zone, and whenever LTHR isn't configured.
  out.hr = fmtHRRange(getTargetHRRangeForDay(dd));
  if (tm.zoneKey && paces[tm.zoneKey] && paces[tm.zoneKey].slow!=null){
    var z = paces[tm.zoneKey];
    // Ascending (fastest bound first), matching the Pace Reference card and
    // the Plan HQ zone table -- the same range printed in two orders on one
    // screen reads like two different targets.
    var pSlow = fmtPaceFromSecPerKm(z.slow), pFast = fmtPaceFromSecPerKm(z.fast);
    out.pace = pFast.split('/')[0]+'\u2013'+pSlow;
  }
  if (dd.type==='race'){
    var gp = getGoalPaceSecPerKm();
    if (gp) out.pace = fmtPaceFromSecPerKm(gp);
  }
  if (dd.mpSegment){
    var gp2 = getGoalPaceSecPerKm();
    if (gp2) out.goalPace = 'Goal '+fmtPaceFromSecPerKm(gp2);
  }
  return out;
}

function computeStats(){
  var totalRuns=0, completedRuns=0, totalKm=0, completedKm=0;
  state.days.forEach(function(dd){
    if (dd.type==='rest') return;
    totalRuns++; totalKm += dd.km||0;
    if (dd.completed){ completedRuns++; completedKm += (dd.actual&&dd.actual.km!=null)?dd.actual.km:(dd.km||0); }
  });
  var raceDay = state.setup && state.setup.raceDate ? state.setup.raceDate : null;
  return {
    totalRuns:totalRuns, completedRuns:completedRuns, totalKm:round1(totalKm), completedKm:round1(completedKm),
    daysToRace: raceDay ? daysBetween(todayStr(), raceDay) : null
  };
}
function weekDateRange(weekNum){
  var wdays = state.days.filter(function(dd){ return dd.week===weekNum; });
  return { start: wdays[0].date, end: wdays[wdays.length-1].date };
}
function totalWeeksInPlan(){ return state.days.length ? state.days[state.days.length-1].week : 0; }

/* =========================================================
   CONFIDENCE SCORE — a live weighted average of every completed day's
   Workout Execution Score (see computeExecutionScore below), not just a
   completion-rate tally: Long Runs and quality sessions (tempo/threshold/
   interval/repetition/checkpoint) count 2x, easy/recovery days count 1x.
   Days that aren't completed, or don't yet have enough actual data (km +
   pace + HR) to score, simply don't contribute -- with none completed
   yet this naturally returns 0, the same neutral baseline a fresh plan
   always showed.
   ========================================================= */
function executionWeightForType(type){
  if (type==='long') return 2.0;
  if (type==='tempo' || type==='threshold' || type==='interval' || type==='repetition' || type==='checkpoint') return 2.0;
  return 1.0; // easy/recovery, and any other completed type that scores
}
function computeConfidenceScore(){
  if (!state.setup) return null;
  var totalWeight = 0, weightedSum = 0;
  state.days.forEach(function(dd){
    if (!dd.completed) return;
    var score = computeExecutionScore(dd);
    if (score==null) return;
    var w = executionWeightForType(dd.type);
    totalWeight += w;
    weightedSum += score*w;
  });
  if (!totalWeight) return 0;
  return weightedSum/totalWeight;
}
// whole numbers, matching the execution-score pills/banner -- the gauge and
// the scores feeding it are the same family of metric.
function formatConfidencePct(pct){
  return String(Math.round(pct));
}
function renderConfidenceGauge(){
  if (!state.setup) return '';
  var pct = computeConfidenceScore();
  var clamped = Math.max(0, Math.min(100, pct));
  var cx=54, cy=50, r=40;
  var angle = Math.PI*(1-clamped/100);
  var needleLen = r*0.82;
  var needleX = cx + needleLen*Math.cos(angle);
  var needleY = cy - needleLen*Math.sin(angle);
  var arcLen = Math.PI*r;
  var fillLen = arcLen*(clamped/100);
  var ticks = [0,25,50,75,100].map(function(t){
    var a = Math.PI*(1-t/100);
    var x1 = cx+(r-2)*Math.cos(a), y1 = cy-(r-2)*Math.sin(a);
    var x2 = cx+(r+4)*Math.cos(a), y2 = cy-(r+4)*Math.sin(a);
    return '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" class="gauge-tick"/>';
  }).join('');
  var pctLabel = formatConfidencePct(clamped);
  return '<div class="confidence-gauge" role="img" aria-label="Confidence score '+pctLabel+' percent">'+
    '<svg viewBox="0 0 108 64" width="88" height="52">'+
      '<defs>'+
        '<filter id="gaugeGlow" x="-60%" y="-60%" width="220%" height="220%">'+
          '<feGaussianBlur stdDeviation="1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>'+
        '</filter>'+
        '<linearGradient id="gaugeFillGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="var(--gold-deep)"/><stop offset="100%" stop-color="var(--modal-active)"/></linearGradient>'+
      '</defs>'+
      '<path d="M '+(cx-r)+' '+cy+' A '+r+' '+r+' 0 0 1 '+(cx+r)+' '+cy+'" fill="none" stroke="var(--bg-4)" stroke-width="6" stroke-linecap="round"/>'+
      '<path d="M '+(cx-r)+' '+cy+' A '+r+' '+r+' 0 0 1 '+(cx+r)+' '+cy+'" fill="none" stroke="url(#gaugeFillGrad)" stroke-width="6" stroke-linecap="round" '+
        'stroke-dasharray="'+fillLen.toFixed(1)+' '+(arcLen-fillLen).toFixed(1)+'"/>'+
      '<g filter="url(#gaugeGlow)">'+ticks+'</g>'+
      '<line x1="'+cx+'" y1="'+cy+'" x2="'+needleX.toFixed(1)+'" y2="'+needleY.toFixed(1)+'" stroke="var(--modal-active)" stroke-width="2.4" stroke-linecap="round" filter="url(#gaugeGlow)"/>'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="3" fill="var(--modal-active)"/>'+
      '<text x="'+(cx-r)+'" y="'+(cy+11)+'" class="gauge-elabel">E</text>'+
      '<text x="'+(cx+r-6)+'" y="'+(cy+11)+'" class="gauge-flabel">F</text>'+
    '</svg>'+
    '<div class="gauge-caption"><span class="gauge-pct font-mono">'+pctLabel+'%</span><span class="gauge-label">Confidence</span></div>'+
  '</div>';
}

function pad2(n){ return n<10 ? '0'+n : ''+n; }
function renderCountdown(){
  if (!state.setup) return '';
  var target = new Date(state.setup.raceDate+'T00:00:00').getTime();
  var diff = Math.max(0, target-Date.now());
  if (diff<=0) return '<div class="countdown"><span class="cd-race-day">Race Day \u2014 Go!</span></div>';
  var days = Math.floor(diff/86400000);
  var hours = Math.floor((diff%86400000)/3600000);
  var mins = Math.floor((diff%3600000)/60000);
  var secs = Math.floor((diff%60000)/1000);
  return '<div class="countdown-badge">'+
    '<span class="cd-cell font-mono">'+days+'d</span>'+
    '<span class="cd-cell font-mono">'+pad2(hours)+'h</span>'+
    '<span class="cd-cell font-mono">'+pad2(mins)+'m</span>'+
    '<span class="cd-cell font-mono">'+pad2(secs)+'s</span>'+
  '</div>';
}

// Re-render when the local date has moved past the one on screen. Rides
// the countdown's existing 1s tick rather than adding a timer.
function checkDateRollover(){
  if (!state.setup || !lastRenderedDate) return;
  if (todayStr() === lastRenderedDate) return;
  // never pull the DOM out from under someone mid-entry -- the next tick,
  // or the next time the app is foregrounded, picks it up once they blur
  var el = document.activeElement;
  if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
  renderApp();
}
var countdownTimer = null;
function startCountdownTimer(){
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(function(){

/* =========================================================
   EXECUTION SCORING SUPPORT — target/actual resolution used by the
   single scoring engine below.
   ========================================================= */

function getTargetPaceRangeSecPerKm(dd){
  var tm = TYPE_META[dd.type];
  if (!tm || !tm.zoneKey) return null;
  var z = getActivePaces()[tm.zoneKey];
  if (!z || z.slow==null) return null;
  return { slow:z.slow, fast:z.fast }; // slow = larger sec/km (easier bound), fast = smaller sec/km (harder bound)
}
function actualPaceSecPerKm(dd){
  if (!dd.actual || !dd.actual.pace) return null;
  var sec = paceToSec(dd.actual.pace);
  if (sec==null) return null;
  return state.units==='mi' ? sec/1.60934 : sec;
}

/* =========================================================
   WORKOUT EXECUTION SCORE (0-100) — Distance 40% + Pace 40% + HR 20%.
   A separate, always-on metric from the opt-in AI Coach review above
   (which scores RPE, not HR, and only runs when the runner asks for it):
   this one is computed automatically for every completed day the moment
   actual km/pace/HR are all logged, feeds the day-card banner/pill, and
   is the sole input to the Plan HQ confidence gauge below. Reuses
   getTargetPaceRangeSecPerKm/getGoalPaceSecPerKm/actualPaceSecPerKm/
   getTargetHRRangeForDay rather than re-deriving targets.
   ========================================================= */
function isRecoveryWorkoutType(type){ return type==='easy' || type==='long'; }
// Distance Score = min(actual/target, 1.0) x 100 -- capped so overshooting
// distance never scores higher than hitting it exactly.
function computeDistanceScore(targetKm, actualKm){
  if (!targetKm || targetKm<=0 || actualKm==null) return null;
  return clamp(Math.min(actualKm/targetKm, 1)*100, 0, 100);
}
// 100% inside the prescribed pace window (or within ~2% of goal pace for
// race/goal-pace-segment days, which have no zone window). Outside the
// window, the penalty direction is asymmetric by workout intent: easy/long
// days are penalised harder for running too FAST (over-cooking a recovery
// day); quality days (tempo/threshold/interval/repetition) are penalised
// harder for running too SLOW (failing to hit the required intensity).
// Running faster is never rewarded above 100 either way.
function computePaceScore(dd, actualPaceSp){
  if (actualPaceSp==null) return null;
  var targetRange = dd.type==='race' ? null : getTargetPaceRangeSecPerKm(dd);
  var goalPace = (dd.type==='race' || dd.mpSegment) ? getGoalPaceSecPerKm() : null;
  var recovery = isRecoveryWorkoutType(dd.type);

  if (targetRange && targetRange.slow!=null){
    // slow = larger sec/km (easier/slower bound), fast = smaller sec/km (harder/faster bound)
    if (actualPaceSp<=targetRange.slow && actualPaceSp>=targetRange.fast) return 100;
    if (actualPaceSp<targetRange.fast){
      var overshoot = (targetRange.fast-actualPaceSp)/targetRange.fast;
      var overMult = recovery ? 5 : 2.5;
      return clamp(100-overshoot*100*overMult, 0, 100);
    }
    var undershoot = (actualPaceSp-targetRange.slow)/targetRange.slow;
    var underMult = recovery ? 2.5 : 5;
    return clamp(100-undershoot*100*underMult, 0, 100);
  }
  if (goalPace){
    var dev = Math.abs(actualPaceSp-goalPace)/goalPace;
    return clamp(100-dev*100*3, 0, 100);
  }
  return null;
}
// 100% inside the workout's designated HR zone. Below the zone is
// under-intensity (penalised harder for quality sessions failing to reach
// the required effort); above the zone is over-intensity (penalised harder
// for easy/recovery days, and never rewarded regardless of type).
function computeHRScore(dd, actualHR){
  if (actualHR==null) return null;
  var zone = getTargetHRRangeForDay(dd);
  if (!zone || zone.lo==null) return null;
  var recovery = isRecoveryWorkoutType(dd.type);
  var hi = zone.hi!=null ? zone.hi : Infinity;
  if (actualHR>=zone.lo && actualHR<=hi) return 100;
  if (actualHR<zone.lo){
    var short = (zone.lo-actualHR)/zone.lo;
    var underMult = recovery ? 2 : 4;
    return clamp(100-short*100*underMult, 0, 100);
  }
  var over = (actualHR-hi)/hi;
  var overMult = recovery ? 5 : 2.5;
  return clamp(100-over*100*overMult, 0, 100);
}
// Effort realism: does reported RPE match what this session type should
// have felt like? Reuses expectedRPEBand, the same band the old separate
// coach review used, so nothing about that judgement changed -- it is just
// now one component of the single score instead of a rival score.
function computeRPEScore(dd, rpe){
  if (rpe==null) return null;
  var band = expectedRPEBand(dd);
  if (!band) return null;
  if (rpe>=band[0] && rpe<=band[1]) return 100;
  var off = rpe<band[0] ? band[0]-rpe : rpe-band[1];
  return clamp(100-off*15, 0, 100);
}

// THE scoring engine. Everything that shows a number -- the EXEC pill, the
// gold banner, the Execution Review block and the Plan HQ confidence gauge
// -- resolves through this, so there is exactly one score per session and
// no way for two surfaces to disagree.
//
// Distance and pace are the 70% core: without both there is nothing solid
// to judge, so no score is shown at all rather than a misleading one. HR
// and RPE are scored when available and their weight is redistributed
// proportionally when not, so a runner with no LTHR configured (or who
// skips RPE) still gets a meaningful score from what they did log. The
// review block names any component that sat out, so the number is never
// silently based on less than it appears.
var EXECUTION_WEIGHTS = { distance:0.35, pace:0.35, hr:0.20, rpe:0.10 };
function computeExecutionBreakdown(dd){
  if (!dd || !dd.completed) return null;
  var a = dd.actual || {};
  var parts = [
    { key:'distance', label:'Distance', weight:EXECUTION_WEIGHTS.distance, score:computeDistanceScore(dd.km, a.km) },
    { key:'pace',     label:'Pace',     weight:EXECUTION_WEIGHTS.pace,     score:computePaceScore(dd, actualPaceSecPerKm(dd)) },
    { key:'hr',       label:'HR',       weight:EXECUTION_WEIGHTS.hr,       score:computeHRScore(dd, a.hr) },
    { key:'rpe',      label:'Effort',   weight:EXECUTION_WEIGHTS.rpe,      score:computeRPEScore(dd, a.rpe) }
  ];
  var counted = parts.filter(function(p){ return p.score!=null; });
  var have = {};
  counted.forEach(function(p){ have[p.key] = true; });
  if (!have.distance || !have.pace) return null;
  var totalW = counted.reduce(function(sum,p){ return sum+p.weight; }, 0);
  var raw = counted.reduce(function(sum,p){ return sum+p.score*p.weight; }, 0) / totalW;
  return {
    score: clamp(Math.round(raw), 0, 100),
    parts: parts,
    counted: counted,
    missing: parts.filter(function(p){ return p.score==null; })
  };
}
function computeExecutionScore(dd){
  var b = computeExecutionBreakdown(dd);
  return b ? b.score : null;
}

function expectedRPEBand(dd){
  if (dd.type==='easy' || dd.type==='long') return [2,5];
  if (dd.type==='tempo' || dd.type==='threshold') return [6,8];
  if (dd.type==='interval' || dd.type==='repetition') return [7,9];
  if (dd.type==='checkpoint' || dd.type==='race') return [8,10];
  return null;
}
// Auto-generated coaching notes explaining the score above. Deterministic
// and instant -- this replaces the old opt-in Claude/local "AI review",
// which produced its own rival score; there is now one number and this
// text simply explains how it was reached.
function composeExecutionNotes(dd, b){
  var a = dd.actual || {};
  var tm = TYPE_META[dd.type];
  var by = {}; b.parts.forEach(function(p){ by[p.key] = p; });
  // the chip labels are compact by design; prose wants the long forms
  var PROSE = { distance:'distance', pace:'pace', hr:'heart rate', rpe:'effort' };
  var out = [];

  var nailed = b.counted.filter(function(p){ return p.score>=99.5; });
  if (nailed.length===b.counted.length){
    out.push('Nailed '+listPhrase(nailed.map(function(p){ return PROSE[p.key]; }))+'.');
  } else if (b.score>=90){
    out.push('Strong execution — barely off plan.');
  } else if (b.score>=75){
    out.push('Solid session, with some drift from the prescribed targets.');
  } else if (b.score>=55){
    out.push('Mixed — parts held to plan, parts drifted.');
  } else {
    out.push('This landed well away from the prescribed session.');
  }

  if (by.distance.score!=null && by.distance.score<99.5){
    out.push('Distance came in at '+fmtDist(a.km)+' against a '+fmtDist(dd.km)+' target.');
  }

  var tr = dd.type==='race' ? null : getTargetPaceRangeSecPerKm(dd);
  var ap = actualPaceSecPerKm(dd);
  if (by.pace.score!=null && by.pace.score<99.5 && tr && ap!=null){
    var faster = ap < tr.fast;
    var window = fmtPaceFromSecPerKm(tr.fast).split('/')[0]+'–'+fmtPaceFromSecPerKm(tr.slow);
    out.push('Pace ran '+(faster?'faster':'slower')+' than the '+window+' window'+
      (faster && isRecoveryWorkoutType(dd.type) ? ' — easy days are meant to stay easy.' : '.'));
  }

  var z = getTargetHRRangeForDay(dd);
  if (by.hr.score!=null && by.hr.score<99.5 && z){
    out.push('Average HR '+a.hr+' bpm sat '+(a.hr<z.lo?'below':'above')+' the '+fmtHRRange(z)+' zone.');
  }

  if (by.rpe.score!=null){
    var band = expectedRPEBand(dd);
    var sessionName = dd.title || tm.label;
    if (by.rpe.score>=99.5) out.push('RPE '+a.rpe+' aligns with '+sessionName+' effort.');
    else out.push('RPE '+a.rpe+' reads '+(a.rpe<band[0]?'easier':'harder')+' than the '+band[0]+'–'+band[1]+' expected for '+sessionName+'.');
  }

  if (b.missing.length){
    out.push('Not scored: '+listPhrase(b.missing.map(function(p){ return PROSE[p.key]; }))+
      (by.hr.score==null && state.setup && state.setup.lthr==null ? ' (set your LTHR to include heart rate).' : '.'));
  }
  return out.join(' ');
}
function listPhrase(items){
  if (items.length<=1) return items[0]||'';
  return items.slice(0,-1).join(', ')+' and '+items[items.length-1];
}

// The Execution Review block on a completed card: the same single score as
// the pill and banner, plus the notes and a component breakdown showing
// how it was reached. No button and no loading state -- it recomputes
// automatically whenever a logged field changes (see patchExecutionUI).
function renderExecutionReview(dd){
  if (!dd.completed) return '';

  var breakdown = b.parts.map(function(p){

}

var expandedWeeks = {};
function initExpanded(){
  expandedWeeks = {};
  var today = todayStr();
  var totalWeeks = totalWeeksInPlan();
  var found = false;
  for (var w=1; w<=totalWeeks; w++){
    var r = weekDateRange(w);
    if (today>=r.start && today<=r.end){ expandedWeeks[w]=true; found=true; break; }
  }
  if (!found && totalWeeks>0) expandedWeeks[1]=true;
}
function currentWeekNum(){
  var today = todayStr();
  var totalWeeks = totalWeeksInPlan();
  for (var w=1; w<=totalWeeks; w++){
    var r = weekDateRange(w);
    if (today>=r.start && today<=r.end) return w;
  }
  return totalWeeks>0 ? 1 : null;
}
function weekVolume(weekNum){
  var wdays = state.days.filter(function(dd){ return dd.week===weekNum; });
  var totalKm=0, doneKm=0;
  wdays.forEach(function(dd){
    totalKm += dd.km||0;
    if (dd.completed) doneKm += (dd.actual&&dd.actual.km!=null)?dd.actual.km:(dd.km||0);
  });
  return { total: round1(totalKm), done: round1(doneKm) };
}
function weekPhaseLabel(weekNum){
  var wdays = state.days.filter(function(dd){ return dd.week===weekNum; });
  var hasCheckpoint = wdays.some(function(dd){ return dd.type==='checkpoint'; });
  var hasRace = wdays.some(function(dd){ return dd.type==='race'; });
  if (hasRace) return 'Race Week';
  if (hasCheckpoint) return 'Fitness Checkpoint';
  if (isTaperWeek(weekNum)) return 'Taper Phase';
  return 'Week '+weekNum;
}
function renderWeekAccordion(weekNum, forceOpen){
  var wdays = state.days.filter(function(dd){ return dd.week===weekNum; });
  var range = weekDateRange(weekNum);
  var vol = weekVolume(weekNum);
  var today = todayStr();
  var hasToday = today>=range.start && today<=range.end;
  var daysHtml = wdays.map(renderDayCard).join('');
  var openCls = (forceOpen || expandedWeeks[weekNum]) ? ' open' : '';
  var taper = isTaperWeek(weekNum);
  var taperNote = taper ? '<div class="taper-note">'+ICONS.zap+' Taper: volume drops, but keep hitting these paces \u2014 sharpness matters more than mileage from here.</div>' : '';
  return '<div class="week'+openCls+(taper?' is-taper':'')+'" id="week-'+weekNum+'">'+
    '<button type="button" class="week-head" data-action="toggle-week" data-week="'+weekNum+'">'+
      '<div class="week-num font-display">'+(weekNum<10?'0':'')+weekNum+'</div>'+
      '<div class="week-meta">'+
        '<div class="week-phase font-head">'+weekPhaseLabel(weekNum)+(hasToday?'<span class="week-today-flag font-head">Now</span>':'')+'</div>'+
        '<div class="week-range font-mono">'+dShort(range.start)+' \u2013 '+dShort(range.end)+'</div>'+
      '</div>'+
      '<div class="week-vol"><div class="v font-mono">'+kmToDisplay(vol.done)+'/'+kmToDisplay(vol.total)+'</div><div class="l font-head">'+displayUnit()+'</div></div>'+
      '<div class="week-chevron">'+ICONS.chevronDown+'</div>'+
    '</button>'+
    taperNote+
    '<div class="week-body"><div class="week-body-inner">'+daysHtml+renderZoneBreakdown(weekNum)+'</div></div>'+
  '</div>';
}

function computeWeekZoneBreakdown(weekNum){
  var wdays = state.days.filter(function(dd){ return dd.week===weekNum; });
  var paces = getActivePaces();
  var goalPace = getGoalPaceSecPerKm();
  var mid = function(z){ return (z && z.slow!=null) ? (z.slow+z.fast)/2 : null; };
  var easyPace = mid(paces.E), tPace = mid(paces.T), iPace = mid(paces.I);
  var zones = { easy:0, mp:0, threshold:0, interval:0 };
  function addTime(key, km, paceSec){ if (km>0 && paceSec) zones[key] += km*paceSec; }

  wdays.forEach(function(dd){
    if (dd.type==='rest' || !dd.km) return;
    if (dd.type==='easy'){ addTime('easy', dd.km, easyPace); }
    else if (dd.type==='long'){
      if (dd.mpSegment && goalPace){ addTime('mp', dd.km*0.3, goalPace); addTime('easy', dd.km*0.7, easyPace); }
      else { addTime('easy', dd.km, easyPace); }
    }
    else if (dd.type==='tempo' || dd.type==='threshold'){ addTime('threshold', dd.km, tPace); }
    else if (dd.type==='interval' || dd.type==='repetition'){ addTime('interval', dd.km, iPace); }
    else if (dd.type==='checkpoint'){ addTime('easy', dd.km*0.4, easyPace); addTime('threshold', dd.km*0.6, tPace); }
    else if (dd.type==='race'){ if (goalPace) addTime('mp', dd.km, goalPace); else addTime('easy', dd.km, easyPace); }
  });
  var totalSec = zones.easy+zones.mp+zones.threshold+zones.interval;
  return { zones:zones, totalSec:totalSec };
}

function renderZoneBreakdown(weekNum){
  var zb = computeWeekZoneBreakdown(weekNum);
  if (zb.totalSec<=0) return '';
  var pct = {};
  ['easy','mp','threshold','interval'].forEach(function(k){ pct[k] = Math.round(100*zb.zones[k]/zb.totalSec); });
  var sum = pct.easy+pct.mp+pct.threshold+pct.interval;
  if (sum!==100 && sum>0){
    var maxKey = 'easy';
    ['mp','threshold','interval'].forEach(function(k){ if (pct[k]>pct[maxKey]) maxKey=k; });
    pct[maxKey] += (100-sum);
  }
  var totalH = Math.floor(zb.totalSec/3600), totalM = Math.round((zb.totalSec%3600)/60);
  var meta = [
    {k:'easy', label:'Easy / Recovery', cls:'z-easy'},
    {k:'mp', label:'Goal / MP', cls:'z-mp'},
    {k:'threshold', label:'Threshold / Tempo', cls:'z-threshold'},
    {k:'interval', label:'Interval / VO2max', cls:'z-interval'}
  ];
  var segs = meta.filter(function(m){ return pct[m.k]>0; }).map(function(m){
    return '<div class="zbar-seg '+m.cls+'" style="width:'+pct[m.k]+'%"></div>';
  }).join('');
  var legend = meta.filter(function(m){ return pct[m.k]>0; }).map(function(m){
    return '<div class="zleg-item"><span class="zleg-dot '+m.cls+'"></span>'+m.label+' '+pct[m.k]+'%</div>';
  }).join('');
  return '<div class="zone-card">'+
    '<div class="zone-head"><span class="font-head">Weekly Zone Breakdown</span><span class="zone-time font-mono">'+totalH+'h '+(totalM<10?'0':'')+totalM+'m time-on-feet</span></div>'+
    '<div class="zbar">'+segs+'</div>'+
    '<div class="zone-legend">'+legend+'</div>'+
  '</div>';
}

function renderCheckpointCard(){
  var chkDay = null;
  state.days.forEach(function(dd){ if (dd.type==='checkpoint') chkDay = dd; });
  if (!chkDay) return '';
  var hint = '';
  if (chkDay.completed && chkDay.actual && chkDay.actual.pace){
    hint = '<div class="hint font-mono">Your checkpoint effort: '+chkDay.actual.pace+'/'+displayUnit()+(chkDay.actual.hr?(' @ '+chkDay.actual.hr+' bpm'):'')+'</div>';
  }
  return '<div class="checkpoint">'+
    '<h3 class="font-display">Fitness Checkpoint</h3>'+
    '<p>Week '+chkDay.week+' is your data point. Reconsider your Active Goal below \u2014 every workout pace and the race-day target update automatically.</p>'+
    hint+
    renderGoalToggle()+
  '</div>';
}

function renderCongratsBanner(){
  var s = computeStats();
  if (!s.totalRuns || s.completedRuns<s.totalRuns) return '';
  return '<div class="congrats-banner">'+
    '<div class="cg-title font-display">VALHALLA AWAITS</div>'+
    '<div class="cg-quote font-head">THE PLAN IS EXECUTED.<br>VALHALLA AWAITS THE BOLD!<br>GO KILL IT, VIKING!</div>'+
  '</div>';
}
function renderWeeksList(forceOpenAll){
  var totalWeeks = totalWeeksInPlan();
  var chkWeek = null;
  state.days.forEach(function(dd){ if (dd.type==='checkpoint') chkWeek = dd.week; });
  var html = '';
  for (var w=1; w<=totalWeeks; w++){
    html += renderWeekAccordion(w, forceOpenAll);
    if (w===chkWeek) html += renderCheckpointCard();
  }
  html += renderCongratsBanner();
  return html;
}

function handleRecalibrateSuggest(){
  var benchDist = document.getElementById('rc-bench-dist').value;
  var benchSec = clockToSec(document.getElementById('rc-bench-time').value.trim());

function handleGeneratePlan(){
  var distanceKey = document.getElementById('su-distance').value;
  var raceDate = document.getElementById('su-racedate').value;
  var unitsBox = document.getElementById('su-units');
  var chosenUnitsBtn = unitsBox ? unitsBox.querySelector('button.active') : null;
  var chosenUnits = chosenUnitsBtn ? chosenUnitsBtn.getAttribute('data-units') : state.units;
  if (chosenUnits==='km' || chosenUnits==='mi') state.units = chosenUnits;
  var volume = parseDistInput(document.getElementById('su-volume').value);
  var benchDist = document.getElementById('su-bench-dist').value;
  var benchSec = clockToSec(document.getElementById('su-bench-time').value.trim());
  var lthrInput = parseInt(document.getElementById('su-lthr').value, 10);
  var maxHRInput = parseInt(document.getElementById('su-maxhr').value, 10);
  var lthr = (!isNaN(lthrInput) && lthrInput>0) ? lthrInput : null;
  var maxHR = (!isNaN(maxHRInput) && maxHRInput>0) ? maxHRInput : null;

  var wdBoxes = document.querySelectorAll('#su-weekdays input[type=checkbox]');
  var activeDays = [];
  wdBoxes.forEach(function(cb){ if (cb.checked) activeDays.push(parseInt(cb.getAttribute('data-wd'),10)); });
  var longRunDay = parseInt(document.getElementById('su-longday').value,10);

  if (!raceDate){ showToast('Pick a race date'); return; }
  if (!volume || volume<=0){ showToast('Enter your current weekly volume'); return; }
  if (raceDate <= todayStr()){ showToast('Race date needs to be in the future'); return; }
  if (activeDays.length<3 || activeDays.length>6){ showToast('Pick between 3 and 6 running days'); return; }
  if (isNaN(longRunDay)){ showToast('Choose a long run day'); return; }

  // The block always starts on the runner's very first available running day
  // from today -- never a hardcoded/default offset -- and its length is
  // whatever real span (weeks + leftover days) actually falls between that
  // day and the race date, not a fixed weekly grid worked backward from race day.
  var startDate = firstActiveDayOnOrAfter(todayStr(), activeDays);
  if (raceDate < startDate){
    showToast('Your first available running day falls after that race date \u2014 pick a later race date');
    return;
  }
  var startMonday = addDays(startDate, -isoWeekday(startDate));
  var raceMonday = addDays(raceDate, -isoWeekday(raceDate));
  var planWeeks = daysBetween(startMonday, raceMonday)/7 + 1;

  var goals = {};
  var anyGoal = false;
  GOAL_KEYS.forEach(function(k){
    var el = document.getElementById('su-goal-'+k);
    var sec = clockToSec(el.value.trim());
    if (sec){ goals[k] = {timeSec:sec}; anyGoal = true; }
  });
  if (!anyGoal){ showToast('Enter at least one goal time (or tap Suggest first)'); return; }
  var activeGoal = (state.setup && state.setup.activeGoal && goals[state.setup.activeGoal])
    ? state.setup.activeGoal
    : GOAL_KEYS.filter(function(k){ return goals[k]; })[0];

  var profile = DISTANCE_PROFILES[distanceKey];
  var schedule = { activeDays:activeDays, longRunDay:longRunDay };
  var blockResult = buildBlockWeeks(distanceKey, volume, planWeeks);
  var days = buildDaysFromWeeks(blockResult, raceDate, schedule, startDate);

  state.setup = {
    distanceKey: distanceKey, currentVolume: volume, raceDate: raceDate, startDate: startDate, planWeeks: blockResult.planWeeks,
    schedule: schedule,
    benchmark: benchSec ? { distanceKey:benchDist, timeSec:benchSec } : (state.setup?state.setup.benchmark:null),
    goals: goals, activeGoal: activeGoal,
    paceOverrides: state.setup ? (state.setup.paceOverrides || {}) : {},
    lthr: lthr!=null ? lthr : (state.setup ? state.setup.lthr : null),
    maxHR: maxHR!=null ? maxHR : (state.setup ? state.setup.maxHR : null)
  };
  state.days = days;
  initExpanded();
  closeModal();
  scheduleSave();
  renderApp();
  showToast('Plan generated \u2014 '+planLengthLabel(daysBetween(startDate,raceDate)+1)+' to '+profile.label+', starting '+dShort(startDate));
}

/* =========================================================
   STRAVA INTEGRATION \u2014 OAuth 2.0 + activity sync.
   The Client Secret lives only in /api/strava-auth.js's server environment
   (STRAVA_CLIENT_ID / STRAVA_CLIENT_SECRET, set in Vercel Project Settings
   -> Environment Variables) -- it is never sent to or stored in the browser.
   The client only ever handles the resulting access/refresh tokens.
   ========================================================= */
var STRAVA_TOKENS_KEY = 'vvv_strava_tokens';

function getStravaTokens(){
  if (!storageAvailable) return null;
  try{ var raw = window.localStorage.getItem(STRAVA_TOKENS_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function setStravaTokens(tok){
  if (!storageAvailable) return;
  if (tok) window.localStorage.setItem(STRAVA_TOKENS_KEY, JSON.stringify(tok));
  else window.localStorage.removeItem(STRAVA_TOKENS_KEY);
}
function isStravaConnected(){ var t = getStravaTokens(); return !!(t && t.access_token); }

function handleStravaConnect(){
  window.location.href = '/api/strava-auth?action=authorize';
}
function handleStravaDisconnect(){
  setStravaTokens(null);
  showToast('Strava disconnected');
  openImportModal();
}
async function exchangeStravaCode(code){
  try{
    var resp = await fetch('/api/strava-auth', {
      method:'POST',
      headers:{ 'content-type':'application/json' },
      body: JSON.stringify({ code:code })
    });
    var data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Strava rejected the token exchange');
    if (!data.access_token) throw new Error('No access token in the response');
    setStravaTokens({ access_token:data.access_token, refresh_token:data.refresh_token, expires_at:data.expires_at });
    showToast('Strava connected \u2014 syncing your recent runs\u2026');
    await fetchStravaRuns();
  }catch(err){
    showToast(err.message || 'Strava connection failed');
  }
}
async function handleStravaOAuthCallback(){
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var error = params.get('error');
  if (!code && !error) return;
  var cleanUrl = window.location.origin + window.location.pathname;
  window.history.replaceState({}, document.title, cleanUrl);
  if (error){ showToast('Strava connection cancelled'); return; }
  await exchangeStravaCode(code);
}
async function ensureStravaAccessToken(){
  var t = getStravaTokens();
  if (!t) return null;
  var nowSec = Math.floor(Date.now()/1000);
  if (t.expires_at && t.expires_at > nowSec+60) return t.access_token;
  if (!t.refresh_token) return t.access_token;
  try{
    var resp = await fetch('/api/strava-auth', {
      method:'POST', headers:{ 'content-type':'application/json' },
      body: JSON.stringify({ refresh_token:t.refresh_token })
    });
    if (!resp.ok) throw new Error('refresh failed');
    var data = await resp.json();
    var fresh = { access_token:data.access_token, refresh_token:data.refresh_token||t.refresh_token, expires_at:data.expires_at };
    setStravaTokens(fresh);
    return fresh.access_token;
  }catch(e){ return t.access_token; }
}
async function fetchStravaRuns(){
  if (!isStravaConnected()){ showToast('Connect Strava first'); return; }
  var token = await ensureStravaAccessToken();
  if (!token){ showToast('Strava session expired \u2014 reconnect'); return; }
  showToast('Syncing from Strava\u2026');
  try{
    var resp = await fetch('https://www.strava.com/api/v3/athlete/activities?per_page=50', {
      headers:{ 'Authorization':'Bearer '+token }
    });
    if (resp.status===401){ setStravaTokens(null); throw new Error('Strava session expired \u2014 reconnect'); }
    if (!resp.ok) throw new Error('Strava request failed (status '+resp.status+')');
    var activities = await resp.json();
    var runs = activities.filter(function(a){ return a.type==='Run' || a.sport_type==='Run'; });
    var applied = 0;
    runs.forEach(function(a){
      var dateStr = (a.start_date_local || a.start_date || '').slice(0,10);
      if (!dateStr) return;
      var dd = findDayByDate(dateStr);
      if (!dd || dd.type==='rest') return;
      var km = a.distance!=null ? round1(a.distance/1000) : null;
      var paceSecPerKm = (a.moving_time && a.distance) ? (a.moving_time/(a.distance/1000)) : null;
      dd.completed = true;
      dd.actual = dd.actual || { km:null, pace:null, hr:null, rpe:null, notes:'' };
      if (km!=null) dd.actual.km = km;
      if (paceSecPerKm) dd.actual.pace = paceSecPerKmToStoredStr(paceSecPerKm);
      if (a.average_heartrate) dd.actual.hr = Math.round(a.average_heartrate);
      if (!dd.actual.notes) dd.actual.notes = 'Synced from Strava';
      applied++;
    });
    if (applied){ scheduleSave(); renderApp(); showToast('Synced '+applied+' run'+(applied===1?'':'s')+' from Strava'); }
    else showToast('No Strava runs matched a day in your current plan');
    if (document.getElementById('modal-overlay')) openImportModal();
  }catch(err){
    showToast(err.message || 'Strava sync failed');
  }
}

function handleImportFile(file){
  var name = file.name.toLowerCase();
  var resultEl = document.getElementById('import-result');
  if (resultEl) resultEl.innerHTML = '<div class="empty-note">Reading '+escapeHtml(file.name)+'\u2026</div>';
  if (name.endsWith('.gpx') || name.endsWith('.csv') || name.endsWith('.tcx')){
    var r = new FileReader();
    r.onload = function(){
      try{
        var parsed = name.endsWith('.gpx') ? parseGPX(r.result) : name.endsWith('.tcx') ? parseTCX(r.result) : parseCSV(r.result);
        renderImportResult(parsed, file.name);
      }catch(err){ renderImportError(err); }
    };
    r.onerror = function(){ renderImportError(new Error('Couldn\u2019t read that file.')); };
    r.readAsText(file);
  } else if (name.endsWith('.fit')){
    var r2 = new FileReader();
    r2.onload = function(){
      try{ renderImportResult(parseFIT(r2.result), file.name); }
      catch(err){ renderImportError(err); }
    };
    r2.onerror = function(){ renderImportError(new Error('Couldn\u2019t read that file.')); };
    r2.readAsArrayBuffer(file);
  } else {
    renderImportError(new Error('Please choose a .gpx, .fit, .tcx or .csv file.'));
  }
}

function renderImportError(err){
  var resultEl = document.getElementById('import-result');

    '<div>'+escapeHtml(err.message||'Couldn\u2019t parse that file.')+' You can still log the run by hand \u2014 check off the matching day below.</div></div>';
}

function generateExportText(){
  var lines = [];
  var profile = state.setup ? DISTANCE_PROFILES[state.setup.distanceKey] : null;
  lines.push('VELVET VIKING VALHALLA \u2014 TRAINING BLOCK');
  if (profile && state.setup){
    var goal = getActiveGoal();
    var vdot = getActiveVDOT();
    lines.push(profile.label+' \u00b7 '+totalWeeksInPlan()+'-Week '+profile.blockName+' \u00b7 Race: '+dLong(state.setup.raceDate));
    lines.push('Active Goal '+state.setup.activeGoal+': '+(goal?secToClock(goal.timeSec):'\u2014')+' (VDOT '+(vdot?vdot.toFixed(1):'\u2014')+')');
    var paces = getActivePaces();
    // ascending (fastest bound first), in the runner's own unit
    var pRange = function(z){ return z.slow ? secToPace(paceSecToDisplay(z.fast))+'-'+secToPace(paceSecToDisplay(z.slow)) : '\u2014'; };
    var u = '/'+displayUnit();
    lines.push('Paces \u2014 Easy '+pRange(paces.E)+u+', Threshold '+pRange(paces.T)+u+', Interval '+pRange(paces.I)+u);
  }
  lines.push('');
  var totalWeeks = totalWeeksInPlan();
  for (var w=1; w<=totalWeeks; w++){
    var vol = weekVolume(w);
    lines.push('WEEK '+w+' ('+weekPhaseLabel(w)+') \u2014 '+kmToDisplay(vol.done)+'/'+fmtDist(vol.total));
    state.days.filter(function(dd){ return dd.week===w; }).forEach(function(dd){
      var line = '  '+dow(dd.date)+' '+dShort(dd.date)+' \u2014 '+TYPE_META[dd.type].label+' \u2014 '+dd.title;
      if (dd.km) line += ' ('+fmtDist(dd.km)+' planned)';
      if (dd.type==='rest'){ line += ' \u2014 REST'; }
      else if (dd.completed){
        var a = dd.actual||{};
        var parts = [];
        if (a.km!=null) parts.push(fmtDist(a.km));
        if (a.pace) parts.push(a.pace+'/'+displayUnit());
        if (a.hr!=null) parts.push(a.hr+'bpm');
        if (a.rpe!=null) parts.push('RPE '+a.rpe);
        line += ' \u2014 COMPLETED: '+parts.join(', ');
        if (a.notes) line += ' \u2014 "'+String(a.notes).replace(/"/g,'\'')+'"';
      } else {
        line += ' \u2014 planned, not yet logged';
      }
      lines.push(line);
    });
    lines.push('');
  }
  return lines.join('\n');
}

   ========================================================= */
function icsEscape(str){
  return String(str||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function generateICS(){
  var stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  var lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Velvet Viking Valhalla//Training Block//EN','CALSCALE:GREGORIAN'];
  state.days.forEach(function(dd){
    if (dd.type==='rest') return;
    var dateCompact = dd.date.replace(/-/g,'');
    var summary = TYPE_META[dd.type].label+': '+dd.title+(dd.km?' ('+fmtDist(dd.km)+')':'');
    lines.push('BEGIN:VEVENT');
    lines.push('UID:'+dd.date+'-'+dd.type+'@velvetvikingvalhalla');
    lines.push('DTSTAMP:'+stamp);
    lines.push('DTSTART;VALUE=DATE:'+dateCompact);
    lines.push('SUMMARY:'+icsEscape(summary));
    lines.push('DESCRIPTION:'+icsEscape(resolveDesc(dd.desc)));
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
function handleExportICS(){
  if (!state.days.length){ showToast('Build a plan first'); return; }
  var blob = new Blob([generateICS()], { type:'text/calendar;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'velvet-viking-training-block.ics';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Calendar file downloaded \u2014 import it into Apple or Google Calendar');
}

function handleToggleComplete(dayId){
  var dd = findDay(dayId);
  if (!dd || dd.type==='rest') return;
  dd.completed = !dd.completed;
  if (dd.completed && !dd.actual) dd.actual = { km:dd.km, pace:null, hr:null, rpe:null, notes:'' };
  else if (dd.completed && dd.actual && dd.actual.km==null) dd.actual.km = dd.km;
  replaceCard(dd);
  patchDerivedStats();
  scheduleSave();
}
function handleActualFieldChange(dayId, field, value){
  var dd = findDay(dayId);
  if (!dd) return;
  dd.actual = dd.actual || { km:null, pace:null, hr:null, rpe:null, notes:'' };
  if (field==='km') dd.actual.km = value===''?null:parseDistInput(value);
  else if (field==='hr') dd.actual.hr = value===''?null:parseInt(value,10);
  else if (field==='rpe') dd.actual.rpe = value===''?null:parseInt(value,10);
  else if (field==='pace') dd.actual.pace = value.trim() || null;
  else if (field==='notes') dd.actual.notes = value;
  // Auto-run: the score and its coaching notes regenerate on every logged
  // change -- no "get review" button. patchExecutionUI touches only the
  // score mounts, so the input being edited keeps its focus and value.
  patchExecutionUI(dd);
  patchDerivedStats();
  scheduleSave();
}
function handleClearActual(dayId){
  var dd = findDay(dayId);
  if (!dd) return;
  dd.actual = { km:null, pace:null, hr:null, rpe:null, notes:'' };
  replaceCard(dd);
  patchDerivedStats();
  scheduleSave();
  showToast('Log cleared');
}

function doSwapDays(idA, idB){
  var a = findDay(idA), b = findDay(idB);
  if (!a || !b) return;
  var tmp = { type:a.type, title:a.title, km:a.km, desc:a.desc, mpSegment:a.mpSegment, completed:a.completed, actual:a.actual };
  a.type=b.type; a.title=b.title; a.km=b.km; a.desc=b.desc; a.mpSegment=b.mpSegment; a.completed=b.completed; a.actual=b.actual;
  b.type=tmp.type; b.title=tmp.title; b.km=tmp.km; b.desc=tmp.desc; b.mpSegment=tmp.mpSegment; b.completed=tmp.completed; b.actual=tmp.actual;
  scheduleSave();
  renderApp();
  showToast('Swapped '+dow(a.date)+' '+dShort(a.date)+' with '+dow(b.date)+' '+dShort(b.date));
}

// elsewhere would otherwise look enabled but silently never fire.
function renderNotifyToggleRow(){
  var supported = typeof Notification!=='undefined';
  var revoked = supported && Notification.permission==='denied';
  var on = state.notifyEnabled && supported && Notification.permission==='granted';
  var desc = !supported ? 'Not supported in this browser'
    : revoked ? 'Blocked — enable notifications for this site in your browser/device settings'
    : on ? 'On — fires once today’s workout is ready' : 'Off';
  return '<div class="connect-row" id="notify-toggle-row">'+
    '<div><div class="name">Daily 08:00 Workout Reminder</div><div class="desc">'+desc+'</div></div>'+
    '<label class="switch"><input type="checkbox" data-action="toggle-notify" '+(on?'checked':'')+(supported?'':' disabled')+'><span class="switch-track"></span></label>'+
  '</div>';
}
// Theme now lives only here -- the header's old icon-button toggle is gone
// (see renderTopbar). Switch "on" = dark (the app's default); flipping it
// calls the exact same handleToggleThemeQuick()/handleSetTheme() the header
// button used to, so there's still only one theme system.
// Account card. Hidden entirely until cloud sync is configured, so the app
// never advertises a feature that isn't wired up.
function renderCloudCard(){
  if (!cloudConfigured()) return '';
  var body;
  if (cloudSignedIn()){
    var label = { syncing:'Syncing…', synced:'Backed up', error:'Offline — will retry' }[cloudStatus] || 'Signed in';
    body = '<div class="connect-row">'+
        '<div><div class="name">'+escapeHtml(cloudSession.email||'Signed in')+'</div><div class="desc">'+label+'</div></div>'+
        '<button type="button" class="btn btn-sm btn-ghost" data-action="cloud-sign-out">Sign out</button>'+
      '</div>';
  } else {
    body = '<div class="field-hint" style="margin-bottom:10px;">Sign in to back your plan up and use it on more than one device. We email you a link — there is no password.</div>'+
      '<div class="field" style="margin-bottom:8px;"><label>Email</label><input type="email" id="cloud-email" placeholder="you@example.com" autocomplete="email"></div>'+
      '<button type="button" class="btn btn-primary btn-block" data-action="cloud-sign-in">'+ICONS.link+' Email me a sign-in link</button>';
  }
  return '<div class="hub-card" id="cloud-card">'+
    '<div class="setup-section-title">Account &amp; Backup</div>'+body+
  '</div>';
}
function patchCloudCard(){
  var el = document.getElementById('cloud-card');
  if (el) el.outerHTML = renderCloudCard();
}
function handleCloudSignIn(){
  var el = document.getElementById('cloud-email');
  var email = el ? el.value.trim() : '';
  if (!email || email.indexOf('@')===-1){ showToast('Enter a valid email address'); return; }
  showToast('Sending your sign-in link…');
  cloudSendMagicLink(email)
    .then(function(){ showToast('Check your email for the sign-in link'); })
    .catch(function(){ showToast('Couldn’t send the link — check your connection'); });
}
function renderThemeToggleRow(){
  var isDark = state.theme==='dark';
  return '<div class="connect-row" id="theme-toggle-row">'+
    '<div><div class="name">App Theme (Dark / Light)</div><div class="desc">'+(isDark?'Dark':'Light')+'</div></div>'+
    '<label class="switch"><input type="checkbox" data-action="toggle-theme-switch" '+(isDark?'checked':'')+'><span class="switch-track"></span></label>'+
  '</div>';
}
function patchThemeToggle(){
  var el = document.getElementById('theme-toggle-row');
  if (el) el.outerHTML = renderThemeToggleRow();
}
// Settings hub: everything that used to live behind the FAB's popover menu,
// now a normal view tab. Sub-options either fire a direct action (save/clear
// key, export/reset) or open one of the existing modals -- openModal() always
// closes any modal already open first, so there's never a nesting risk.
function renderSettingsHubView(){
  return '<div class="view-heading font-head">Settings</div>'+
    renderCloudCard()+
    '<div class="hub-card">'+
      '<div class="setup-section-title">Preferences &amp; Notifications</div>'+
      renderNotifyToggleRow()+
      renderThemeToggleRow()+
    '</div>'+
    '<div class="hub-card">'+
      '<div class="setup-section-title">Training &amp; Zones</div>'+
      '<button type="button" class="btn btn-primary btn-block" style="margin-bottom:8px;" data-action="open-recalibrate">'+ICONS.zap+' Re-calibrate Training Zones</button>'+
      '<button type="button" class="btn btn-ghost btn-block" style="margin-bottom:8px;" data-action="open-setup">'+ICONS.target+' Edit Plan Settings</button>'+
      '<button type="button" class="btn btn-ghost btn-block" data-action="open-pacing">'+ICONS.ruler+' Race Day Pacing Strategy</button>'+
    '</div>'+
    '<div class="hub-card">'+
      '<div class="setup-section-title">AI Coaching</div>'+
      '<button type="button" class="btn btn-ghost btn-block" data-action="open-export">'+ICONS.sparkles+' Export AI Coaching Prompt</button>'+
    '</div>'+
    '<div class="hub-card">'+
      '<div class="setup-section-title">Sync &amp; Export</div>'+
      renderStravaSection()+
      '<button type="button" class="btn btn-ghost btn-block" style="margin:10px 0 8px;" data-action="open-import">'+ICONS.watch+' Garmin File Import</button>'+
      '<button type="button" class="btn btn-ghost btn-block" data-action="export-ics">'+ICONS.clock+' Export to iCal (.ics)</button>'+
    '</div>'+
    '<div class="hub-card">'+
      '<div class="setup-section-title">Backup &amp; Reset</div>'+
      '<button type="button" class="btn btn-ghost btn-block" style="margin-bottom:8px;" data-action="export-json">'+ICONS.download+' Export Full Backup (JSON)</button>'+
      '<label class="btn btn-ghost btn-block" style="margin-bottom:14px;" for="import-json-input">'+ICONS.upload+' Import Backup (JSON)</label>'+
      '<input type="file" accept="application/json" id="import-json-input" style="display:none;">'+
      '<button type="button" class="btn btn-danger btn-block" data-action="reset-plan">'+ICONS.trash+' Reset Plan — Start Over</button>'+
    '</div>'+
    '<div class="build-tag">Build '+BUILD_ID+'</div>';
}
function renderBottomNav(){
  var view = state.view || 'today';
  var items = [
    {key:'today', label:'Today', icon:ICONS.clock},
    {key:'week', label:'This Week', icon:ICONS.calendarWeek},
    {key:'full', label:'Full Plan', icon:ICONS.layers},
    {key:'planhq', label:'Plan HQ', icon:ICONS.target},
    {key:'settings', label:'Settings', icon:ICONS.settings}
  ];
  return '<nav class="bottom-nav" id="bottom-nav">'+
    items.map(function(it){
      return '<button type="button" class="bn-item'+(view===it.key?' active':'')+'" data-action="set-view" data-view="'+it.key+'">'+it.icon+'<span>'+it.label+'</span></button>';
    }).join('')+
  '</nav>';
}
function handleSetView(view){
  if (state.view===view) return;
  state.view = view;
  scheduleSave();
  renderApp();
}
function renderMainContent(){
  if (!state.setup) return renderHero();
  var view = state.view || 'today';
  if (view==='week') return renderWeekView();
  if (view==='full') return renderFullPlanView();
  if (view==='planhq') return renderPlanHQView();
  if (view==='settings') return renderSettingsHubView();
  return renderTodayView();
}

// The calendar day the rendered DOM represents. "Today" is date-driven
// (todayStr()), not advanced by completing a session, so a page left open
// or backgrounded across midnight would otherwise keep showing yesterday
// -- including the Today tab itself and the gold TODAY flags on This Week
// and Full Plan. checkDateRollover() below repairs that.
var lastRenderedDate = null;
function renderApp(){
  document.documentElement.setAttribute('data-theme', state.theme);
  var app = document.getElementById('app');
  if (!app) return;
  lastRenderedDate = todayStr();
  app.innerHTML =
    renderTopbar()+
    '<div class="wrap"><div id="view-mount" class="view-fade">'+renderMainContent()+'</div></div>'+
    (state.setup ? renderBottomNav() : '');
}

/* =========================================================
   EVENT DELEGATION
   ========================================================= */
document.addEventListener('click', function(e){
  var target = e.target.closest ? e.target.closest('[data-action]') : null;
  if (!target) return;
  var action = target.getAttribute('data-action');
  switch(action){
    case 'toggle-theme': handleToggleThemeQuick(); break;
    case 'toggle-week': handleToggleWeek(parseInt(target.getAttribute('data-week'),10)); break;
    case 'set-goal': handleSetGoal(target.getAttribute('data-goal')); break;
    case 'open-edit': openEditModal(target.getAttribute('data-day')); break;
    case 'save-edit': handleSaveEdit(target.getAttribute('data-day')); break;
    case 'reset-day': handleResetDay(target.getAttribute('data-day')); break;
    case 'reset-plan': handleResetPlan(); break;
    case 'close-modal': closeModal(); break;
    case 'clear-actual': handleClearActual(target.getAttribute('data-day')); break;
    case 'open-settings': openSettingsModal(); break;
    case 'open-import': openImportModal(); break;
    case 'open-export': openExportModal(); break;
    case 'open-setup': openSetupModal(); break;
    case 'open-recalibrate': openRecalibrateModal(); break;
    case 'rc-suggest-goals': handleRecalibrateSuggest(); break;
    case 'save-recalibrate': handleSaveRecalibrate(); break;
    case 'open-pacing': openPacingModal(); break;
    case 'suggest-goals': handleSuggestGoals(); break;
    case 'generate-plan': handleGeneratePlan(); break;
    case 'export-json': handleExportJson(); break;
    case 'set-units': handleSetUnits(target.getAttribute('data-units')); break;
    case 'apply-activity': handleApplyActivity(); break;
    case 'strava-connect': handleStravaConnect(); break;
    case 'strava-sync': fetchStravaRuns(); break;
    case 'strava-disconnect': handleStravaDisconnect(); break;
    case 'apply-csv-row': handleApplyCsvRow(parseInt(target.getAttribute('data-row'),10)); break;
    case 'copy-export': handleCopyExport(); break;
    case 'download-export': handleDownloadExport(); break;
    case 'export-ics': handleExportICS(); break;
    case 'print-plan': handlePrintPlan(); break;
    case 'reset-pace-overrides': handleResetPaceOverrides(); break;
    case 'set-view': handleSetView(target.getAttribute('data-view')); break;
    case 'cloud-sign-in': handleCloudSignIn(); break;
    case 'cloud-sign-out': cloudSignOut(); break;
    case 'cloud-keep-local': handleCloudKeepLocal(); break;
    case 'cloud-keep-remote': handleCloudKeepRemote(); break;
  }
});

document.addEventListener('change', function(e){
  var t = e.target;
  if (t.id === 'import-json-input'){ handleImportJsonFile(e); return; }
  var actionEl = t.closest ? t.closest('[data-action]') : null;
  if (!actionEl) return;
  var action = actionEl.getAttribute('data-action');
  if (action === 'toggle-complete') handleToggleComplete(actionEl.getAttribute('data-day'));
  else if (action === 'actual-field') handleActualFieldChange(actionEl.getAttribute('data-day'), actionEl.getAttribute('data-field'), actionEl.value);
  else if (action === 'pace-override') handlePaceOverrideChange(actionEl.getAttribute('data-zone'));
  else if (action === 'toggle-notify') handleToggleNotify();
  else if (action === 'toggle-theme-switch') handleToggleThemeQuick();
});

/* drag-and-drop reschedule (desktop enhancement; mobile uses the Swap-with dropdown in Edit Session) */
var dragSourceId = null;
document.addEventListener('dragstart', function(e){
  var card = e.target.closest ? e.target.closest('.day[draggable="true"]') : null;
  if (!card) return;
  dragSourceId = card.getAttribute('data-day');
  card.classList.add('dragging');
  if (e.dataTransfer){ e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain', dragSourceId); }catch(err){} }
});
document.addEventListener('dragend', function(e){
  var card = e.target.closest ? e.target.closest('.day') : null;
  if (card) card.classList.remove('dragging');
  var overs = document.querySelectorAll('.day.drag-over');
  for (var i=0;i<overs.length;i++) overs[i].classList.remove('drag-over');
});
document.addEventListener('dragover', function(e){
  var card = e.target.closest ? e.target.closest('.day[draggable="true"]') : null;
  if (!card) return;
  e.preventDefault();
  card.classList.add('drag-over');
});
document.addEventListener('dragleave', function(e){
  var card = e.target.closest ? e.target.closest('.day[draggable="true"]') : null;
  if (card) card.classList.remove('drag-over');
});
document.addEventListener('drop', function(e){
  var card = e.target.closest ? e.target.closest('.day[draggable="true"]') : null;
  if (!card) return;
  e.preventDefault();
  card.classList.remove('drag-over');
  var targetId = card.getAttribute('data-day');
  if (dragSourceId && targetId && dragSourceId!==targetId) doSwapDays(dragSourceId, targetId);
  dragSourceId = null;
});

/* =========================================================
   DAILY 08:00 WORKOUT REMINDER -- best-effort local notification. This is
   a single static file with no push/backend infra, so a true "fires even
   when fully closed" schedule isn't available; instead a service worker
   is registered (so the notification can still show while the tab is only
   backgrounded, not closed) and a periodic check fires it once per day the
   first time the app notices it's 08:00 or later and hasn't already fired
   today -- including a catch-up check on load/visibility-change, so opening
   the app later in the day still surfaces today's workout instead of
   staying silent until the next 08:00 tick.
   ========================================================= */
var NOTIFY_LAST_FIRED_KEY = 'vvv_notify_last_fired';
var swRegistration = null;
function registerServiceWorker(){
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('/sw.js').then(function(reg){ swRegistration = reg; }).catch(function(){});
}
function buildTodayNotificationText(){
  var title = '🛡️ Velvet Viking Valhalla — Today’s Workout';
  var dd = state.setup ? findDayByDate(todayStr()) : null;
  if (!dd || dd.type==='rest') return { title:title, body:'Today: Rest Day. Full rest & recovery.' };
  var targets = getDayTargets(dd);
  var body = 'Today: '+fmtDist(dd.km)+' '+dd.title+(targets.pace?(' @ '+targets.pace):'')+'. Earn your place!';
  return { title:title, body:body };
}
function showDailyNotification(){
  var msg = buildTodayNotificationText();
  var opts = { body:msg.body, tag:'vvv-daily-workout', renotify:true, icon:'/assets/icon.png' };
  if (swRegistration && swRegistration.showNotification) swRegistration.showNotification(msg.title, opts);
  else if (typeof Notification!=='undefined'){ try{ new Notification(msg.title, opts); }catch(e){} }
}
function maybeFireDailyNotification(){
  if (!state.notifyEnabled || !state.setup) return;
  if (typeof Notification==='undefined' || Notification.permission!=='granted') return;
  if (new Date().getHours() < 8) return;
  var today = todayStr();
  if (storageAvailable && window.localStorage.getItem(NOTIFY_LAST_FIRED_KEY)===today) return;
  showDailyNotification();
  if (storageAvailable) window.localStorage.setItem(NOTIFY_LAST_FIRED_KEY, today);
}
var notifyTimer = null;
function startNotificationScheduler(){
  if (notifyTimer) clearInterval(notifyTimer);
  maybeFireDailyNotification();
  notifyTimer = setInterval(maybeFireDailyNotification, 60000);
}
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState!=='visible'){ flushSave(); return; }
  checkDateRollover();
  maybeFireDailyNotification();
});
window.addEventListener('pagehide', flushSave);
function handleToggleNotify(){
  // Mirror renderNotifyToggleRow's own on/off logic (state flag AND live
  // permission) rather than trusting the stored flag alone, so a click on a
  // toggle that's rendering as off (e.g. permission revoked externally while
  // state.notifyEnabled was still true) always tries to turn it back on.
  var supported = typeof Notification!=='undefined';
  var currentlyOn = state.notifyEnabled && supported && Notification.permission==='granted';
  if (!currentlyOn){
    if (!supported){ showToast('Notifications aren’t supported in this browser'); return; }
    Notification.requestPermission().then(function(perm){
      state.notifyEnabled = (perm==='granted');
      scheduleSave();
      if (state.notifyEnabled){
        maybeFireDailyNotification();
        showToast('Daily 08:00 reminder enabled');
      } else {
        showToast('Notifications blocked — enable them in your browser/device settings to use this');
      }
      patchNotifyToggle();
    });
  } else {
    state.notifyEnabled = false;
    scheduleSave();
    patchNotifyToggle();
    showToast('Daily reminder turned off');
  }
}
function patchNotifyToggle(){
  var el = document.getElementById('notify-toggle-row');
  if (el) el.outerHTML = renderNotifyToggleRow();
}

/* =========================================================
   INIT
   ========================================================= */
function init(){
  loadState();
  if (state.setup && state.days && state.days.length) initExpanded();
  renderApp();
  startCountdownTimer();
  registerServiceWorker();
  startNotificationScheduler();
  // Deliberately last and un-awaited: the app is already painted from
  // localStorage by this point, so cloud sync can never delay startup and a
  // cloud failure can never prevent the app from opening.
  try{ cloudInit(); }catch(e){ cloudStatus='error'; }
  if (window.location.search.indexOf('code=')!==-1 || window.location.search.indexOf('error=')!==-1) handleStravaOAuthCallback();
}
try{ init(); }
catch(err){
  console.error('Velvet Viking init failed', err);
  var app = document.getElementById('app');
  if (app) app.innerHTML = '<div class="wrap" style="padding-top:50px; text-align:center; color:var(--ink-dim);">Something went wrong loading the plan \u2014 please refresh the page.</div>';
}
</script>
