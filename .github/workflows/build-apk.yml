name: Build Android APK

# Runs on every push to the repository. This only builds the native Capacitor
# app shell -- it never touches the Vercel deployment, which deploys straight
# from the repo root independently of this workflow.
on:
  push:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Exact commit SHA, tag or branch to build. Leave blank to build the current branch tip.'
        required: false
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      # THE EXACT COMMIT, NOT "whatever the branch is now". A Play upload is a
      # thing somebody has to be able to point at later: the artifact, the SHA
      # it came from, and the tests that passed on it have to be the same
      # moment. A manual run may name any SHA or tag; a push run pins to the
      # commit that triggered it rather than to the branch head, which can
      # already have moved by the time the runner starts.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # @capacitor/cli 8.x refuses to run on anything older than Node 22
          # ("The Capacitor CLI requires NodeJS >=22.0.0") -- this is what
          # failed the previous run, pinned to Node 20.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # THE WHOLE SUITE, BEFORE ANY BUILD, and deliberately before the Android
      # toolchain is even installed: it needs no SDK, it is the cheapest thing
      # here, and a red suite must not produce a signed artifact that somebody
      # could upload. `npm test` is the repository's own entry point, so this
      # cannot drift from what a developer runs locally.
      - name: Run the complete automated suite
        run: npm test

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          # @capacitor/android 8.x hardcodes sourceCompatibility/targetCompatibility
          # to JavaVersion.VERSION_21 in its own gradle module (confirmed in
          # node_modules/@capacitor/android/capacitor/build.gradle) -- JDK 17
          # cannot compile against a newer release than itself, so this build
          # only succeeds on JDK 21+. Verified against the actual CI failure
          # ("error: invalid source release: 21") before reverting to 21.
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor native project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # Optional: sign every build with one stable key instead of the throwaway
      # debug keystore the build machine generates. Without this the certificate
      # changes on every run, so Android App Link verification can never match
      # assetlinks.json and a new APK will not install over the old one. Skipped
      # entirely when the secret is not set -- see ANDROID-APP-LINKS.md.
      # (`secrets` is not readable from a step `if:`, so it is lifted into `env`
      # at job level below and tested from there.)
      - name: Restore signing keystore
        id: keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vvv.keystore"
          echo "path=$RUNNER_TEMP/vvv.keystore" >> "$GITHUB_OUTPUT"

      - name: "Build DEBUG TEST BUILD (assembleDebug)"
        working-directory: android
        env:
          VVV_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          VVV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VVV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VVV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      # The value that has to go into assetlinks.json. Only worth copying once a
      # stable keystore is configured above -- otherwise it changes every build.
      - name: Print DEBUG TEST BUILD signing fingerprint
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          # Pick exactly one build-tools version: the glob matches several, and
          # passing the extra paths as arguments makes apksigner read the second
          # one as its command ("Unsupported command: .../apksigner").
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-256 digest'

      - name: Upload DEBUG TEST BUILD artifact
        uses: actions/upload-artifact@v4
        with:
          name: velvet-viking-valhalla-DEBUG-TEST-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Everything below produces the SIGNED RELEASE BUILD -- the artifact a
      # human actually uploads to Play Console or installs for controlled
      # device verification. It only runs once the four VVV_KEYSTORE_* secrets
      # are configured (same guard as the "Restore signing keystore" step
      # above): the release buildType has no debug-signing fallback at all
      # (see android/app/build.gradle), so without a real key there is nothing
      # valid to build. Skipped, not attempted-and-failed, until the owner
      # adds the secrets -- the debug build above still gives a green signal
      # in the meantime.
      - name: Note release build skipped (no signing secrets yet)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          echo "::notice::SIGNED RELEASE BUILD skipped -- ANDROID_KEYSTORE_BASE64 (and the matching ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD) are not yet configured as repository secrets. See ANDROID-APP-LINKS.md."

      - name: "Build SIGNED RELEASE BUILD -- Play Store artifact (bundleRelease)"
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          VVV_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          VVV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VVV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VVV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: "Build SIGNED RELEASE BUILD -- device-testing artifact (assembleRelease)"
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          VVV_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          VVV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VVV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VVV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Print SIGNED RELEASE BUILD fingerprint
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-256 digest'

      # WHAT WAS ACTUALLY BUILT, WRITTEN WHERE THE PERSON UPLOADING IT WILL SEE
      # IT. A Play Console upload is irreversible in the sense that a version
      # code can never be reused, so the identity of the artifact -- package,
      # version, and the commit it came from -- belongs in the run summary
      # rather than in somebody's memory of which run they clicked.
      #
      # Read from the gradle file rather than hardcoded, so a version bump
      # cannot make this summary quietly wrong. No secret is read or printed.
      - name: Report build identity
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          APP_ID=$(grep -oP 'applicationId "\K[^"]+' android/app/build.gradle)
          VCODE=$(grep -oP 'versionCode \K[0-9]+' android/app/build.gradle)
          VNAME=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          test -n "$AAB" || { echo "::error::no .aab was produced"; exit 1; }
          {
            echo "### Android release bundle"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Bundle | \`$(basename "$AAB")\` |"
            echo "| Application ID | \`$APP_ID\` |"
            echo "| versionCode | $VCODE |"
            echo "| versionName | $VNAME |"
            echo "| Source commit | \`${{ github.sha }}\` |"
            echo "| Built ref | \`${{ github.event.inputs.ref || github.ref_name }}\` |"
            echo "| Size | $(du -h "$AAB" | cut -f1) |"
            echo ""
            echo "Signed with the repository's stable upload key. **Not published to Google Play** — download the artifact and upload it by hand."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SIGNED RELEASE BUILD artifacts
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: velvet-viking-valhalla-SIGNED-RELEASE
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # Only runs for a pushed tag or a manually-triggered run (workflow_dispatch)
  # -- ordinary branch pushes still just build the APK above and stop there,
  # so this never fires (or spams releases) on every commit.
  create-release:
    needs: build-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download DEBUG TEST BUILD artifact
        uses: actions/download-artifact@v4
        with:
          name: velvet-viking-valhalla-DEBUG-TEST-apk
          path: dist

      - name: Determine release tag
        id: release_tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: dist/**/*.apk
