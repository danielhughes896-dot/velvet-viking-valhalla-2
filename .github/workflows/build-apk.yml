name: Build Android APK

# Runs on every push to the repository. This only builds the native Capacitor
# app shell -- it never touches the Vercel deployment, which deploys straight
# from the repo root independently of this workflow.
on:
  push:
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      # Play refuses an upload whose versionCode is not strictly greater than
      # every code already uploaded for this package -- and refuses it AFTER the
      # upload. run_number is monotonic by construction, so nothing has to be
      # remembered. android/app/build.gradle falls back to 1 when this is unset,
      # so a local build is unchanged.
      VVV_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # @capacitor/cli 8.x refuses to run on anything older than Node 22
          # ("The Capacitor CLI requires NodeJS >=22.0.0") -- this is what
          # failed the previous run, pinned to Node 20.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          # @capacitor/android 8.x hardcodes sourceCompatibility/targetCompatibility
          # to JavaVersion.VERSION_21 in its own gradle module (confirmed in
          # node_modules/@capacitor/android/capacitor/build.gradle) -- JDK 17
          # cannot compile against a newer release than itself, so this build
          # only succeeds on JDK 21+. Verified against the actual CI failure
          # ("error: invalid source release: 21") before reverting to 21.
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The shell's own version, read from one file rather than duplicated across
      # Gradle, Info.plist and the workflow. See RELEASE-VERSION-MODEL.md.
      - name: Resolve shell version
        id: shellver
        run: |
          V=$(node -p "require('./native-version.json').shellVersion")
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "::notice::native shell version $V, versionCode ${VVV_VERSION_CODE}"

      # WHICH SHELL + WHICH WEB COMMIT. The shell loads its UI from Vercel, so
      # "what is this tester running" is two facts, not one. Recording them
      # beside the artifact is what makes a bug report answerable.
      - name: Write build provenance
        run: |
          mkdir -p build-provenance
          cat > build-provenance/PROVENANCE.txt <<EOF
          Velvet Viking native shell
          shellVersion   : ${{ steps.shellver.outputs.name }}
          versionCode    : ${VVV_VERSION_CODE}
          commit         : ${{ github.sha }}
          ref            : ${{ github.ref }}
          workflow run   : ${{ github.run_id }} (attempt ${{ github.run_attempt }})
          built          : $(date -u +%Y-%m-%dT%H:%M:%SZ)
          remote runtime : $(node -p "require('./capacitor.config.json').server.url")
          appId          : $(node -p "require('./capacitor.config.json').appId")
          EOF
          cat build-provenance/PROVENANCE.txt

      - name: Sync Capacitor native project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # Optional: sign every build with one stable key instead of the throwaway
      # debug keystore the build machine generates. Without this the certificate
      # changes on every run, so Android App Link verification can never match
      # assetlinks.json and a new APK will not install over the old one. Skipped
      # entirely when the secret is not set -- see ANDROID-APP-LINKS.md.
      # (`secrets` is not readable from a step `if:`, so it is lifted into `env`
      # at job level below and tested from there.)
      - name: Restore signing keystore
        id: keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vvv.keystore"
          echo "path=$RUNNER_TEMP/vvv.keystore" >> "$GITHUB_OUTPUT"

      - name: "Build DEBUG TEST BUILD (assembleDebug)"
        working-directory: android
        env:
          VVV_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          VVV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VVV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VVV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VVV_VERSION_NAME: ${{ steps.shellver.outputs.name }}
        run: ./gradlew assembleDebug --no-daemon

      # The value that has to go into assetlinks.json. Only worth copying once a
      # stable keystore is configured above -- otherwise it changes every build.
      - name: Print DEBUG TEST BUILD signing fingerprint
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          # Pick exactly one build-tools version: the glob matches several, and
          # passing the extra paths as arguments makes apksigner read the second
          # one as its command ("Unsupported command: .../apksigner").
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-256 digest'

      # Deterministic filename: the name alone answers "which shell, which
      # commit". Gradle's app-debug.apk answers neither, and three of them in a
      # downloads folder are indistinguishable.
      - name: Name and checksum DEBUG TEST BUILD
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          BASE="velvet-viking-${{ steps.shellver.outputs.name }}-${VVV_VERSION_CODE}-$SHORT-debug"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/$BASE.apk"
          cp build-provenance/PROVENANCE.txt dist/
          ( cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt )

      - name: Upload DEBUG TEST BUILD artifact
        uses: actions/upload-artifact@v4
        with:
          name: velvet-viking-valhalla-DEBUG-TEST-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/PROVENANCE.txt
          if-no-files-found: error

      # Everything below produces the SIGNED RELEASE BUILD -- the artifact a
      # human actually uploads to Play Console or installs for controlled
      # device verification. It only runs once the four VVV_KEYSTORE_* secrets
      # are configured (same guard as the "Restore signing keystore" step
      # above): the release buildType has no debug-signing fallback at all
      # (see android/app/build.gradle), so without a real key there is nothing
      # valid to build. Skipped, not attempted-and-failed, until the owner
      # adds the secrets -- the debug build above still gives a green signal
      # in the meantime.
      - name: Note release build skipped (no signing secrets yet)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          echo "::notice::SIGNED RELEASE BUILD skipped -- ANDROID_KEYSTORE_BASE64 (and the matching ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD) are not yet configured as repository secrets. See ANDROID-APP-LINKS.md."

      - name: "Build SIGNED RELEASE BUILD -- Play Store artifact (bundleRelease)"
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          VVV_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          VVV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VVV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VVV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VVV_VERSION_NAME: ${{ steps.shellver.outputs.name }}
        run: ./gradlew bundleRelease --no-daemon

      - name: "Build SIGNED RELEASE BUILD -- device-testing artifact (assembleRelease)"
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          VVV_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          VVV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VVV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VVV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VVV_VERSION_NAME: ${{ steps.shellver.outputs.name }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Print SIGNED RELEASE BUILD fingerprint
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-256 digest'

      - name: Name and checksum SIGNED RELEASE BUILD
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          BASE="velvet-viking-${{ steps.shellver.outputs.name }}-${VVV_VERSION_CODE}-$SHORT"
          mkdir -p release-dist
          cp android/app/build/outputs/bundle/release/app-release.aab "release-dist/$BASE.aab"
          cp android/app/build/outputs/apk/release/app-release.apk   "release-dist/$BASE.apk"
          cp build-provenance/PROVENANCE.txt release-dist/
          ( cd release-dist && sha256sum *.aab *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt )
          echo "::notice::AAB is the Play upload artifact; the APK is for direct device verification only."

      - name: Upload SIGNED RELEASE BUILD artifacts
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: velvet-viking-valhalla-SIGNED-RELEASE
          path: |
            release-dist/*.aab
            release-dist/*.apk
            release-dist/SHA256SUMS.txt
            release-dist/PROVENANCE.txt
          if-no-files-found: error

  # Only runs for a pushed tag or a manually-triggered run (workflow_dispatch)
  # -- ordinary branch pushes still just build the APK above and stop there,
  # so this never fires (or spams releases) on every commit.
  create-release:
    needs: build-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download DEBUG TEST BUILD artifact
        uses: actions/download-artifact@v4
        with:
          name: velvet-viking-valhalla-DEBUG-TEST-apk
          path: dist

      - name: Determine release tag
        id: release_tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: dist/**/*.apk

  # ---------------------------------------------------------------------------
  # iOS: everything that can be checked without a Mac.
  #
  # A signed .ipa needs macOS, Xcode and Apple credentials, none of which exist
  # yet -- so this job deliberately stops short of building one. What it DOES do
  # is catch the failures that would otherwise only surface on a borrowed Mac an
  # hour before a submission: an Info.plist that no longer parses, a missing URL
  # scheme (which silently breaks sign-in and nothing else), a missing privacy
  # manifest (which App Store Connect rejects on upload), or a Capacitor sync
  # that fails outright. Capacitor 8 uses Swift Package Manager rather than
  # CocoaPods, which is why `cap sync ios` runs at all on Linux.
  # ---------------------------------------------------------------------------
  validate-ios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Validate iOS configuration
        run: node test/tools/validate-ios.js

      - name: Report the external build gate
        run: |
          echo "::notice::iOS configuration valid. A distributable .ipa still requires macOS + Xcode 26 + an Apple Developer Program team; see STORE-READINESS.md for the exact gate."
