name: Build Android APK

# Runs on every push to the repository. This only builds the native Capacitor
# app shell -- it never touches the Vercel deployment, which deploys straight
# from the repo root independently of this workflow.
on:
  push:
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # @capacitor/cli 8.x refuses to run on anything older than Node 22
          # ("The Capacitor CLI requires NodeJS >=22.0.0") -- this is what
          # failed the previous run, pinned to Node 20.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          # @capacitor/android 8.x hardcodes sourceCompatibility/targetCompatibility
          # to JavaVersion.VERSION_21 in its own gradle module (confirmed in
          # node_modules/@capacitor/android/capacitor/build.gradle) -- JDK 17
          # cannot compile against a newer release than itself, so this build
          # only succeeds on JDK 21+. Verified against the actual CI failure
          # ("error: invalid source release: 21") before reverting to 21.
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor native project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: velvet-viking-valhalla-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Only runs for a pushed tag or a manually-triggered run (workflow_dispatch)
  # -- ordinary branch pushes still just build the APK above and stop there,
  # so this never fires (or spams releases) on every commit.
  create-release:
    needs: build-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: velvet-viking-valhalla-debug-apk
          path: dist

      - name: Determine release tag
        id: release_tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: dist/**/*.apk
